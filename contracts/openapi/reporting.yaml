openapi: 3.1.0
info:
  title: API de reportes e indicadores
  version: 2.0.0
  description: |
    Consulta paginada, configuraciones privadas, exportación completa e instantáneas HTML.
    Las rutas inglesas anteriores continúan como aliases compatibles. Los reportes de negocio
    abarcan Reparto, Manejo, Lotes, Vacunación, Pesadas, Alimentación y Postura.
    Alimentación consulta consumos diarios por receta con sus últimas rectificaciones.
    Alimentación histórica conserva suministros antiguos y su pauta estimada por separado. No se fabrican cobros,
    deudas, tamaños ni datos históricos ausentes. Los permisos de la fuente se revalidan.
    Las sesiones PIN sólo consultan su UP: opciones y agregados se filtran antes de calcularse.
    Las fuentes sin alcance UP demostrable se deniegan. Configuraciones y exportaciones conservan
    su UP; el worker y la descarga privada revalidan el contexto. No se comparten exportaciones
    restringidas mediante enlaces públicos.
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sanctumCookie: []
  - bearerAuth: []
    sharedDeviceHeader: []
    sharedSessionHeader: []
  - sanctumCookie: []
    sharedDeviceCookie: []
    sharedSessionHeader: []
tags:
  - name: Reportes
    description: Fuentes y consultas paginadas de reportes.
  - name: Configuraciones
    description: Presets privados por usuario.
  - name: Exportaciones
    description: Solicitud, seguimiento y descarga de archivos.
paths:
  /gastos/resumen:
    get:
      tags: [Reportes]
      operationId: summarizeRecordedExpenses
      summary: Suma gastos registrados por moneda, período y unidad productiva
      description: >-
        Requiere permiso de lectura de al menos un módulo de gastos. Agrega mantenimiento de galpones,
        combustible y mantenimiento vehicular completado según los permisos de origen. En una UP sólo
        incluye gastos atribuibles a esa unidad. Los importes se devuelven como decimales en texto y
        cada moneda se suma por separado. Una sesión PIN queda limitada a su UP.
      parameters:
        - {name: up_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: desde, in: query, required: true, schema: {type: string, format: date}}
        - name: hasta
          in: query
          required: true
          description: Día inclusivo. Se admiten hasta 366 días.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Totales por moneda y fuente autorizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ExpenseSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidQuery'}
  /reportes/fuentes:
    get:
      tags: [Reportes]
      summary: Lista las fuentes de reporte autorizadas
      operationId: listarFuentesDeReporte
      responses:
        '200':
          description: Fuentes disponibles para el usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reportes/{source}/previsualizaciones:
    post:
      tags: [Reportes]
      summary: Previsualiza una consulta paginada
      operationId: previsualizarReporte
      description: >-
        deliveries.collections combina las entregas confirmadas, los totales del reparto y la cuenta corriente.
        Requiere can_view_delivery_history y can_view_customer_accounts además del permiso de Reportes.
        Admite filtros y agrupaciones publicados por la fuente. La deuda es el saldo vigente al consultar,
        mientras que el cobro y el importe pendiente corresponden al momento de la entrega.
        lots.summary devuelve una fila por lote con galpón actual, fecha de ingreso, raza,
        capacidad física, aves actuales, mortandad y postura del período y estado actual.
        Requiere can_view_flocks, can_view_mortality y can_view_egg_collections.
        Su rango from/to filtra los hechos e incluye lotes presentes durante el período.
        entry_date permite filtrar el ingreso por separado. Sus agrupaciones temporales se refieren al ingreso.
        management.executions incluye management_type como columna, filtro y agrupación.
        management.executions y management.vaccinations permiten seleccionar, filtrar y agrupar responsible,
        con el nombre conservado al realizar la aplicación. Un responsable histórico desconocido es nulo.
        lots.egg-production (Postura) y management.feeding (Alimentación) son fuentes independientes,
        compatibles en from/to, production_unit_id, poultry_house_id, flock_id y agrupaciones day/week/month,
        production_unit, poultry_house y flock. from/to incluye ambos días en America/Montevideo.
        Alimentación requiere can_view_flock_feeding, publica feed_recipe_id/feed_recipe, quantity en kg,
        mode (Automático o Manual) y notes de la última rectificación. Usa una fila por lote y jornada
        con la receta y cantidad efectivas, incluso cero; el galpón es el histórico al cierre del día.
        Sin historia de alojamiento comprobable el galpón es nulo. feed_quantity suma kg y consumption_count
        cuenta jornadas de lotes. Postura requiere can_view_egg_collections, publica quantity en huevos y egg_count.
        Ambas permiten filtrar quantity; Alimentación agrega feed_recipe_id y mode.
        management.feed-supply sigue disponible como Alimentación histórica con sus configuraciones existentes.
        management.overview reúne Lotes, Plan de manejo vigente, Manejos realizados, Pesadas y Movimientos
        y fraccionamientos como filas independientes identificadas por section. Permite filtrar por sección,
        lote, galpón, UP y plan. Requiere todos los permisos de sus componentes. Los movimientos revertidos
        se excluyen y un traslado aparece una vez por lote afectado, sin sumar sus aves entre secciones.
        date_preset=last_month resuelve el mes calendario anterior completo en America/Montevideo cuando from/to
        son nulos. Las fechas explícitas tienen prioridad en consultas y se congelan al solicitar una exportación.
        El catálogo incorpora lots.mortality, lots.medications, accounts.movements,
        inventory.feed-manufacturing, inventory.feed-balances y expenses.poultry-house-maintenance.
        Mortandad y Medicación se agrupan en Lotes. Los mantenimientos de galpones y vehicles.maintenance
        se agrupan en Gastos mediante module.key/module.label, conservando las claves anteriores.
        Los importes con unidad dinámica incorporan su moneda en detalle y agregados para no mezclar monedas.
        La cuenta completa incluye movimientos independientes y compensaciones; su saldo actual no se agrega.
        No admite sesiones PIN ni enlaces públicos. Stock de alimento representa saldos actuales y rechaza fechas.
        Elaboraciones conserva canceladas en el historial pero sólo suma producción no cancelada.
        El gasto de vehículos suma sólo mantenimientos completados; los de galpón excluyen cancelaciones.
      parameters:
        - $ref: '#/components/parameters/Source'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportQuery' }
      responses:
        '200':
          description: Filas y metadatos de paginación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResultResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /configuraciones-reportes:
    get:
      tags: [Configuraciones]
      summary: Lista las configuraciones propias
      operationId: listarConfiguracionesDeReporte
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Configuraciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedPresets' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Configuraciones]
      summary: Crea una configuración propia
      operationId: crearConfiguracionDeReporte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPresetInput' }
      responses:
        '201':
          description: Configuración creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
  /configuraciones-reportes/{reportPreset}:
    parameters:
      - $ref: '#/components/parameters/ReportPreset'
    get:
      tags: [Configuraciones]
      summary: Consulta una configuración propia
      operationId: consultarConfiguracionDeReporte
      responses:
        '200':
          description: Configuración solicitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Configuraciones]
      summary: Actualiza una configuración propia
      operationId: actualizarConfiguracionDeReporte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPresetUpdate' }
      responses:
        '200':
          description: Configuración actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
    delete:
      tags: [Configuraciones]
      summary: Elimina una configuración propia
      operationId: eliminarConfiguracionDeReporte
      responses:
        '204': { description: Configuración eliminada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reportes/{source}/exportaciones:
    post:
      tags: [Exportaciones]
      summary: Solicita una exportación asíncrona
      operationId: solicitarExportacionDeReporte
      description: La exportación de deliveries.collections congela el saldo vigente y los demás datos al generarse. La descarga requiere sesión y permisos del reporte y de sus módulos de origen.
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportExportInput' }
      responses:
        '202':
          description: Exportación encolada o respuesta idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exportaciones-reportes:
    get:
      tags: [Exportaciones]
      summary: Lista las exportaciones propias
      operationId: listarExportacionesDeReporte
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, processing, completed, failed, expired] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Exportaciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedExports' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exportaciones-reportes/combinadas:
    post:
      tags: [Exportaciones]
      summary: Prepara un archivo con varias secciones
      description: Exporta de 2 a 23 fuentes distintas en el orden solicitado. Requiere permiso de lectura y exportación para cada fuente.
      operationId: crearExportacionCombinadaDeReporte
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, sections]
              properties:
                format: { type: string, enum: [xlsx, pdf] }
                sections:
                  type: array
                  minItems: 2
                  maxItems: 23
                  items:
                    type: object
                    additionalProperties: false
                    required: [source_key, query]
                    properties:
                      source_key: { type: string, maxLength: 100 }
                      query: { $ref: '#/components/schemas/ReportQuery' }
      responses:
        '202':
          description: Exportación encolada o respuesta idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exportaciones-reportes/{reportExport}:
    get:
      tags: [Exportaciones]
      summary: Consulta el estado de una exportación propia
      operationId: consultarExportacionDeReporte
      parameters:
        - $ref: '#/components/parameters/ReportExport'
      responses:
        '200':
          description: Estado de la exportación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exportaciones-reportes/{reportExport}/descarga:
    get:
      tags: [Exportaciones]
      summary: Descarga un archivo o visualiza el reporte HTML mediante enlace firmado
      operationId: descargarExportacionDeReporte
      security:
        - bearerAuth: []
        - sanctumCookie: []
        - signedLink: []
      parameters:
        - $ref: '#/components/parameters/ReportExport'
        - name: share
          in: query
          required: false
          schema: { type: integer, enum: [1] }
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [html] }
        - name: page
          in: query
          required: false
          description: Página de la instantánea HTML. Cada enlace de navegación lleva su propia firma.
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: signature
          in: query
          required: false
          schema: { type: string }
        - name: expires
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Archivo XLSX/PDF privado o reporte HTML compartido.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/html: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /exportaciones-reportes/{reportExport}/enlaces-temporales:
    post:
      tags: [Exportaciones]
      summary: Crea un enlace temporal firmado
      description: >-
        La duración se expresa en minutos, hasta 30 días. Conserva el archivo y su instantánea al menos hasta el vencimiento del nuevo enlace.
        La fuente deliveries.collections usa descarga privada.
      operationId: crearEnlaceTemporalDeReporte
      parameters:
        - $ref: '#/components/parameters/ReportExport'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in: { type: integer, minimum: 1, maximum: 43200, default: 30, description: 'Duración en minutos. Opciones habituales: 30, 60, 360, 720, 1440, 10080 y 43200. El máximo puede restringirse por configuración de despliegue.' }
      responses:
        '201':
          description: Enlace temporal creado.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  file_expires_at: { type: [string, 'null'], format: date-time, description: Vencimiento actualizado del archivo exportado. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
  /reportes/{source}/opciones:
    get:
      tags: [Reportes]
      summary: Busca opciones autorizadas para un filtro de la fuente
      operationId: listarOpcionesDeReporte
      parameters:
        - $ref: '#/components/parameters/Source'
        - { name: field, in: query, required: true, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        '200':
          description: Opciones por etiqueta y valor, con paginación de cincuenta elementos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: { type: [string, integer, boolean] }
                        label: { type: string }
                  pagination:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    sanctumCookie: { type: apiKey, in: cookie, name: gam_session }
    sharedDeviceHeader: { type: apiKey, in: header, name: X-Shared-Device-Token }
    sharedDeviceCookie: { type: apiKey, in: cookie, name: gam_shared_device }
    sharedSessionHeader: { type: apiKey, in: header, name: X-GAM-Session }
    signedLink: { type: apiKey, in: query, name: signature, description: 'Firma temporal con expires y share=1; alterar los parámetros invalida la firma.' }
  parameters:
    Source:
      name: source
      in: path
      required: true
      schema: { type: string, example: inventory.stock-balances }
    ReportPreset:
      name: reportPreset
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReportExport:
      name: reportExport
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    ReportSource:
      type: object
      required: [key, module, definition_version, label, description, columns, filters, groupings, metrics, sorts, formats, limits]
      properties:
        key: { type: string }
        module:
          type: object
          required: [key, label]
          properties:
            key: { type: string, description: Identificador estable del módulo para agrupar las fuentes. }
            label: { type: string, description: Nombre del módulo en español. }
        definition_version: { type: string }
        label: { type: string }
        description: { type: string }
        columns: { type: object, additionalProperties: true }
        filters: { type: object, additionalProperties: true }
        groupings: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        sorts: { type: object, additionalProperties: true }
        default_sort: { type: string }
        default_columns: { type: array, items: { type: string } }
        supports_date_range: { type: boolean }
        standard_queries:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              configuration: { $ref: '#/components/schemas/ReportQuery' }
        capabilities:
          type: object
          properties:
            export: { type: boolean }
            share: { type: boolean }
            presets: { type: boolean }
        format_limits: { type: object, additionalProperties: { type: integer } }
        formats:
          type: array
          items: { type: string, enum: [xlsx, pdf] }
        limits:
          type: object
          additionalProperties: false
          properties:
            max_page_size: { type: integer }
            max_range_days: { type: integer, minimum: 0, description: Cero admite todo el historial registrado; las exportaciones mantienen su límite de filas. }
            max_export_rows: { type: integer }
    ReportQuery:
      type: object
      additionalProperties: false
      properties:
        columns: { type: array, items: { type: string }, maxItems: 30 }
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string, enum: [eq, neq, in, not_in, gt, gte, lt, lte, contains] }
              value: {}
        from: { type: [string, 'null'], format: date }
        to: { type: [string, 'null'], format: date }
        date_preset:
          type: [string, 'null']
          enum: [last_month, null]
          description: >-
            Mes calendario anterior completo en America/Montevideo, desde el día 1 hasta el último día
            inclusive. Sólo resuelve fechas si from y to son nulos. En configuraciones guardadas
            conserva ambos nulos para recalcular al abrir. Para guardar fechas fijas, omitir este campo.
        sorts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        sort:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        groupings: { type: array, items: { type: string }, maxItems: 10 }
        metrics:
          type: array
          items: {type: string}
          maxItems: 10
          description: La fuente global deliveries.deliveries expone merchandise_total, delivery_count y unpriced_delivery_count para distinguir importes parciales o desconocidos.
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ExpenseSummary:
      type: object
      required: [up_id, desde, hasta, zona_horaria, fuentes_incluidas, fuentes_sin_permiso, totales]
      properties:
        up_id: {type: [integer, 'null'], minimum: 1}
        desde: {type: string, format: date}
        hasta: {type: string, format: date}
        zona_horaria: {type: string, example: America/Montevideo}
        fuentes_incluidas:
          type: array
          items: {$ref: '#/components/schemas/ExpenseSource'}
        fuentes_sin_permiso:
          type: array
          items: {$ref: '#/components/schemas/ExpenseSource'}
        totales:
          type: array
          items:
            type: object
            required: [moneda, importe, por_fuente]
            properties:
              moneda: {type: string, example: UYU}
              importe: {type: string, example: '51.0000'}
              por_fuente:
                type: array
                items:
                  type: object
                  required: [fuente, importe]
                  properties:
                    fuente: {$ref: '#/components/schemas/ExpenseSource'}
                    importe: {type: string, example: '30.0000'}
    ExpenseSource:
      type: string
      enum: [mantenimiento_galpones, combustible, mantenimiento_vehiculos]
    ReportResult:
      type: object
      required: [source_key, definition_version, columns, rows, aggregates, units, pagination, generated_at]
      properties:
        source_key: { type: string }
        definition_version: { type: string }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        aggregates: { type: array, items: { type: object, additionalProperties: true } }
        units: { type: object, additionalProperties: { type: [string, 'null'] } }
        pagination:
          type: object
          required: [current_page, per_page, total, last_page]
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
        generated_at: { type: string, format: date-time }
    ReportExportInput:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [xlsx, pdf] }
        columns: { type: array, items: { type: string }, maxItems: 30 }
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string, enum: [eq, neq, in, not_in, gt, gte, lt, lte, contains] }
              value: {}
        from: { type: string, format: date }
        to: { type: string, format: date }
        sorts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        sort:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        groupings: { type: array, items: { type: string }, maxItems: 10 }
        metrics: { type: array, items: { type: string }, maxItems: 10 }
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ReportResultResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportResult' }
    ReportPresetInput:
      type: object
      required: [name, source_key, configuration]
      properties:
        name: { type: string, maxLength: 160 }
        source_key: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
    ReportPresetUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 160 }
        source_key: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
    ReportPreset:
      type: object
      required: [id, name, source_key, definition_version, configuration, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        source_key: { type: string }
        definition_version: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
        resolved_configuration:
          allOf: [{ $ref: '#/components/schemas/ReportQuery' }]
          description: Configuración con fechas concretas para inicializar la vista. configuration conserva la plantilla relativa.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportExport:
      type: object
      required: [id, operation_id, source_key, definition_version, format, status, query, file_name, expires_at, created_at]
      properties:
        id: { type: integer }
        operation_id: { type: string, format: uuid }
        source_key: { type: string }
        definition_version: { type: string }
        format: { type: string, enum: [xlsx, pdf] }
        status: { type: string, enum: [pending, processing, completed, failed, expired] }
        query:
          anyOf:
            - $ref: '#/components/schemas/ReportQuery'
            - type: object
              required: [sections]
              properties:
                sections:
                  type: array
                  items:
                    type: object
                    required: [source_key, definition_version]
                    description: Consulta normalizada con la clave y versión de la fuente.
                    additionalProperties: true
                    properties:
                      source_key: { type: string }
                      definition_version: { type: string }
        file_name: { type: string }
        mime_type: { type: [string, 'null'] }
        file_size: { type: [integer, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        failure_code: { type: [string, 'null'] }
        failure_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportPresetResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportPreset' }
    ReportExportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportExport' }
    PaginatedPresets:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReportPreset' } }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    PaginatedExports:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReportExport' } }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    Unauthenticated:
      description: Se requiere autenticación.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: El usuario no tiene permisos suficientes.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Recurso o fuente no encontrada.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflicto de idempotencia o estado.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InvalidQuery:
      description: Consulta o parámetros inválidos.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Límite de solicitudes excedido.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
