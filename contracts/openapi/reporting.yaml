openapi: 3.1.0
info:
  title: API de reportes e indicadores
  version: 2.0.0
  description: |
    Consulta paginada, configuraciones privadas, exportación completa e instantáneas HTML.
    Las rutas inglesas anteriores continúan como aliases compatibles. Los reportes de negocio
    abarcan Reparto, Manejo, Lotes, Vacunación, Pesadas, Alimentación y Postura.
    Alimentación distingue cantidad registrada de pauta diaria estimada. No se fabrican cobros,
    deudas, tamaños ni datos históricos ausentes. Los permisos de la fuente se revalidan.
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sanctumCookie: []
  - bearerAuth: []
    sharedDeviceHeader: []
    sharedSessionHeader: []
  - sanctumCookie: []
    sharedDeviceCookie: []
    sharedSessionHeader: []
tags:
  - name: Reportes
    description: Fuentes y consultas paginadas de reportes.
  - name: Configuraciones
    description: Presets privados por usuario.
  - name: Exportaciones
    description: Solicitud, seguimiento y descarga de archivos.
paths:
  /reportes/fuentes:
    get:
      tags: [Reportes]
      summary: Lista las fuentes de reporte autorizadas
      operationId: listarFuentesDeReporte
      responses:
        '200':
          description: Fuentes disponibles para el usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reportes/{source}/previsualizaciones:
    post:
      tags: [Reportes]
      summary: Previsualiza una consulta paginada
      operationId: previsualizarReporte
      parameters:
        - $ref: '#/components/parameters/Source'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportQuery' }
      responses:
        '200':
          description: Filas y metadatos de paginación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportResultResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /configuraciones-reportes:
    get:
      tags: [Configuraciones]
      summary: Lista las configuraciones propias
      operationId: listarConfiguracionesDeReporte
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Configuraciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedPresets' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Configuraciones]
      summary: Crea una configuración propia
      operationId: crearConfiguracionDeReporte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPresetInput' }
      responses:
        '201':
          description: Configuración creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
  /configuraciones-reportes/{reportPreset}:
    parameters:
      - $ref: '#/components/parameters/ReportPreset'
    get:
      tags: [Configuraciones]
      summary: Consulta una configuración propia
      operationId: consultarConfiguracionDeReporte
      responses:
        '200':
          description: Configuración solicitada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Configuraciones]
      summary: Actualiza una configuración propia
      operationId: actualizarConfiguracionDeReporte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPresetUpdate' }
      responses:
        '200':
          description: Configuración actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPresetResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
    delete:
      tags: [Configuraciones]
      summary: Elimina una configuración propia
      operationId: eliminarConfiguracionDeReporte
      responses:
        '204': { description: Configuración eliminada. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reportes/{source}/exportaciones:
    post:
      tags: [Exportaciones]
      summary: Solicita una exportación asíncrona
      operationId: solicitarExportacionDeReporte
      parameters:
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportExportInput' }
      responses:
        '202':
          description: Exportación encolada o respuesta idempotente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /exportaciones-reportes:
    get:
      tags: [Exportaciones]
      summary: Lista las exportaciones propias
      operationId: listarExportacionesDeReporte
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, processing, completed, failed, expired] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Exportaciones paginadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedExports' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exportaciones-reportes/{reportExport}:
    get:
      tags: [Exportaciones]
      summary: Consulta el estado de una exportación propia
      operationId: consultarExportacionDeReporte
      parameters:
        - $ref: '#/components/parameters/ReportExport'
      responses:
        '200':
          description: Estado de la exportación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExportResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exportaciones-reportes/{reportExport}/descarga:
    get:
      tags: [Exportaciones]
      summary: Descarga un archivo o visualiza el reporte HTML mediante enlace firmado
      operationId: descargarExportacionDeReporte
      security:
        - bearerAuth: []
        - sanctumCookie: []
        - signedLink: []
      parameters:
        - $ref: '#/components/parameters/ReportExport'
        - name: share
          in: query
          required: false
          schema: { type: integer, enum: [1] }
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [html] }
        - name: page
          in: query
          required: false
          description: Página de la instantánea HTML. Cada enlace de navegación lleva su propia firma.
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: signature
          in: query
          required: false
          schema: { type: string }
        - name: expires
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Archivo XLSX/PDF privado o reporte HTML compartido.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/html: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /exportaciones-reportes/{reportExport}/enlaces-temporales:
    post:
      tags: [Exportaciones]
      summary: Crea un enlace temporal firmado
      description: 'La duración se expresa en minutos, hasta 30 días. Conserva el archivo y su instantánea al menos hasta el vencimiento del nuevo enlace. No recupera exportaciones ya expiradas ni acorta enlaces anteriores.'
      operationId: crearEnlaceTemporalDeReporte
      parameters:
        - $ref: '#/components/parameters/ReportExport'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in: { type: integer, minimum: 1, maximum: 43200, default: 30, description: 'Duración en minutos. Opciones habituales: 30, 60, 360, 720, 1440, 10080 y 43200. El máximo puede restringirse por configuración de despliegue.' }
      responses:
        '201':
          description: Enlace temporal creado.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  file_expires_at: { type: [string, 'null'], format: date-time, description: Vencimiento actualizado del archivo exportado. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
  /reportes/{source}/opciones:
    get:
      tags: [Reportes]
      summary: Busca opciones autorizadas para un filtro de la fuente
      operationId: listarOpcionesDeReporte
      parameters:
        - $ref: '#/components/parameters/Source'
        - { name: field, in: query, required: true, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        '200':
          description: Opciones por etiqueta y valor, con paginación de cincuenta elementos.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [value, label]
                      properties:
                        value: { type: [string, integer, boolean] }
                        label: { type: string }
                  pagination:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidQuery' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
    sanctumCookie: { type: apiKey, in: cookie, name: gam_session }
    sharedDeviceHeader: { type: apiKey, in: header, name: X-Shared-Device-Token }
    sharedDeviceCookie: { type: apiKey, in: cookie, name: gam_shared_device }
    sharedSessionHeader: { type: apiKey, in: header, name: X-GAM-Session }
    signedLink: { type: apiKey, in: query, name: signature, description: 'Firma temporal con expires y share=1; alterar los parámetros invalida la firma.' }
  parameters:
    Source:
      name: source
      in: path
      required: true
      schema: { type: string, example: inventory.stock-balances }
    ReportPreset:
      name: reportPreset
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ReportExport:
      name: reportExport
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    ReportSource:
      type: object
      required: [key, definition_version, label, description, columns, filters, groupings, metrics, sorts, formats, limits]
      properties:
        key: { type: string }
        definition_version: { type: string }
        label: { type: string }
        description: { type: string }
        columns: { type: object, additionalProperties: true }
        filters: { type: object, additionalProperties: true }
        groupings: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: true }
        sorts: { type: object, additionalProperties: true }
        default_sort: { type: string }
        default_columns: { type: array, items: { type: string } }
        supports_date_range: { type: boolean }
        standard_queries:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              configuration: { $ref: '#/components/schemas/ReportQuery' }
        capabilities:
          type: object
          properties:
            export: { type: boolean }
            share: { type: boolean }
            presets: { type: boolean }
        format_limits: { type: object, additionalProperties: { type: integer } }
        formats:
          type: array
          items: { type: string, enum: [xlsx, pdf] }
        limits:
          type: object
          additionalProperties: false
          properties:
            max_page_size: { type: integer }
            max_range_days: { type: integer, minimum: 0, description: Cero admite todo el historial registrado; las exportaciones mantienen su límite de filas. }
            max_export_rows: { type: integer }
    ReportQuery:
      type: object
      additionalProperties: false
      properties:
        columns: { type: array, items: { type: string }, maxItems: 30 }
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string, enum: [eq, neq, in, not_in] }
              value: {}
        from: { type: [string, 'null'], format: date }
        to: { type: [string, 'null'], format: date }
        sorts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        sort:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        groupings: { type: array, items: { type: string }, maxItems: 10 }
        metrics: { type: array, items: { type: string }, maxItems: 10 }
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ReportResult:
      type: object
      required: [source_key, definition_version, columns, rows, aggregates, units, pagination, generated_at]
      properties:
        source_key: { type: string }
        definition_version: { type: string }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        aggregates: { type: array, items: { type: object, additionalProperties: true } }
        units: { type: object, additionalProperties: { type: [string, 'null'] } }
        pagination:
          type: object
          required: [current_page, per_page, total, last_page]
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
        generated_at: { type: string, format: date-time }
    ReportExportInput:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [xlsx, pdf] }
        columns: { type: array, items: { type: string }, maxItems: 30 }
        filters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string, enum: [eq, neq, in, not_in] }
              value: {}
        from: { type: string, format: date }
        to: { type: string, format: date }
        sorts:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        sort:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        groupings: { type: array, items: { type: string }, maxItems: 10 }
        metrics: { type: array, items: { type: string }, maxItems: 10 }
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ReportResultResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportResult' }
    ReportPresetInput:
      type: object
      required: [name, source_key, configuration]
      properties:
        name: { type: string, maxLength: 160 }
        source_key: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
    ReportPresetUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 160 }
        source_key: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
    ReportPreset:
      type: object
      required: [id, name, source_key, definition_version, configuration, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        source_key: { type: string }
        definition_version: { type: string }
        configuration: { $ref: '#/components/schemas/ReportQuery' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportExport:
      type: object
      required: [id, operation_id, source_key, definition_version, format, status, query, file_name, expires_at, created_at]
      properties:
        id: { type: integer }
        operation_id: { type: string, format: uuid }
        source_key: { type: string }
        definition_version: { type: string }
        format: { type: string, enum: [xlsx, pdf] }
        status: { type: string, enum: [pending, processing, completed, failed, expired] }
        query: { $ref: '#/components/schemas/ReportQuery' }
        file_name: { type: string }
        mime_type: { type: [string, 'null'] }
        file_size: { type: [integer, 'null'] }
        expires_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        failure_code: { type: [string, 'null'] }
        failure_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportPresetResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportPreset' }
    ReportExportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReportExport' }
    PaginatedPresets:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReportPreset' } }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    PaginatedExports:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReportExport' } }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
  responses:
    Unauthenticated:
      description: Se requiere autenticación.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: El usuario no tiene permisos suficientes.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Recurso o fuente no encontrada.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflicto de idempotencia o estado.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InvalidQuery:
      description: Consulta o parámetros inválidos.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Límite de solicitudes excedido.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
