openapi: 3.1.0
info:
  title: Recetas, elaboración y stock de alimento
  version: 2.1.0
  description: >-
    Alta, consulta, edición exclusiva de cantidades, estados y cálculo exacto
    y elaboración inmediata con descuento distribuido de ingredientes, saldo de alimento
    por receta y UP, cancelación compensatoria, ajustes independientes y mínimos configurables.
    Los endpoints del catálogo y cálculo conservan sus permisos originales.
    Las nuevas operaciones requieren autenticación y sesión válida, sin permiso
    específico provisional, salvo la configuración de mínimos que requiere inventory.manage
    o rol admin. El consumo de lotes tiene su contrato propio en flock-feeding.yaml.
    Los nombres pueden repetirse. El rendimiento es independiente de la suma
    de ingredientes. Los saldos usan gramos enteros con signo; los mínimos son
    enteros no negativos o null cuando no están configurados.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: Recetas
    description: Catálogo global sin asignaciones por unidad productiva.
paths:
  /recetas:
    get:
      tags: [Recetas]
      operationId: listFeedRecipes
      summary: Lista recetas globales con paginación
      description: Requiere feed-recipes.view. Incluye activas e inactivas por defecto; ordena por ID descendente.
      parameters:
        - name: buscar
          in: query
          description: Texto contenido en el nombre, sin distinguir mayúsculas.
          schema: {type: string, maxLength: 120}
        - name: estado
          in: query
          description: Estado de las recetas.
          schema: {$ref: '#/components/schemas/RecipeStatus'}
        - name: por_pagina
          in: query
          description: Cantidad de recetas por página.
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: page
          in: query
          description: Número de página.
          schema: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '200':
          description: Recetas y metadatos de paginación.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Recipe'}
                  links: {type: object, description: Enlaces de paginación de Laravel.}
                  meta: {type: object, description: 'Página actual, total y tamaño de página.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Recetas]
      operationId: createFeedRecipe
      summary: Crea una receta con materias primas existentes
      description: >-
        Requiere feed-recipes.manage. Idempotencia por actor y encabezado UUID.
        La misma clave y contenido normalizado devuelve la receta existente en
        su estado actual, sin reescribir cantidades posteriores; otros datos
        con la misma clave devuelven 409. El orden de ingredientes no cambia
        la identidad del contenido. No crea materias primas ni movimientos.
        La receta nace activa. No exige existencias ni estado activo del producto.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRecipe'}
            example:
              nombre: Ración BB
              nota: Combinación base
              rendimiento_g: '13000'
              ingredientes:
                - {producto_id: 1, cantidad_g: '2000'}
                - {producto_id: 2, cantidad_g: '5000'}
                - {producto_id: 3, cantidad_g: '6000'}
      responses:
        '201': {$ref: '#/components/responses/RecipeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /recetas/{recipe}:
    parameters:
      - {$ref: '#/components/parameters/RecipeId'}
    get:
      tags: [Recetas]
      operationId: getFeedRecipe
      summary: Consulta una receta y su composición actual
      description: Requiere feed-recipes.view. Permite consultar recetas inactivas.
      responses:
        '200': {$ref: '#/components/responses/RecipeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /recetas/{recipe}/cantidades:
    parameters:
      - {$ref: '#/components/parameters/RecipeId'}
    patch:
      tags: [Recetas]
      operationId: updateFeedRecipeQuantities
      summary: Actualiza únicamente las cantidades de ingredientes existentes
      description: >-
        Requiere feed-recipes.manage. Debe enviar la lista completa con los mismos
        producto_id sin agregar, quitar, duplicar ni sustituir ingredientes.
        No admite nombre, nota, rendimiento, estado ni otros campos.
        Permite editar recetas activas e inactivas. Las ediciones se serializan
        mediante lock de la receta. Repetir los valores actuales no genera
        otra auditoría. No exige Idempotency-Key. No recalcula el historial ni stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ingredientes]
              properties:
                ingredientes: {$ref: '#/components/schemas/IngredientList'}
      responses:
        '200': {$ref: '#/components/responses/RecipeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /recetas/{recipe}/estado:
    parameters:
      - {$ref: '#/components/parameters/RecipeId'}
    patch:
      tags: [Recetas]
      operationId: changeFeedRecipeStatus
      summary: Desactiva o reactiva una receta conservando su historial
      description: >-
        Requiere feed-recipes.manage. Serializa con el mismo lock de edición.
        Repetir el estado actual no genera otra auditoría. No exige Idempotency-Key.
        No modifica la composición ni detiene consumos futuros de lotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [estado]
              properties:
                estado: {$ref: '#/components/schemas/RecipeStatus'}
      responses:
        '200': {$ref: '#/components/responses/RecipeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /recetas/{recipe}/calculo:
    parameters:
      - {$ref: '#/components/parameters/RecipeId'}
    post:
      tags: [Recetas]
      operationId: calculateFeedRecipe
      summary: Calcula cantidades para un múltiplo entero de la combinación base
      description: >-
        Requiere feed-recipes.view. Sólo admite cantidad_g, sin ajustes manuales.
        La receta debe estar activa. Si Q no es múltiplo exacto de R devuelve 422.
        Si un ingrediente multiplicado supera 9223372036854775807 g devuelve 422.
        Usa la composición actual bajo un lock compartido. No consulta disponibilidad
        ni modifica saldos, movimientos o auditoría. No necesita Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cantidad_g]
              properties:
                cantidad_g: {$ref: '#/components/schemas/GramsInput'}
            example: {cantidad_g: '26000'}
      responses:
        '200':
          description: Cantidades exactas; no constituye una elaboración ni una reserva.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Calculation'}
              example:
                data:
                  receta_id: 1
                  rendimiento_g: '13000'
                  cantidad_g: '26000'
                  factor: '2'
                  ingredientes:
                    - {producto_id: 1, nombre: Maíz, cantidad_base_g: '2000', cantidad_requerida_g: '4000'}
                    - {producto_id: 2, nombre: Soja, cantidad_base_g: '5000', cantidad_requerida_g: '10000'}
                    - {producto_id: 3, nombre: Arroz, cantidad_base_g: '6000', cantidad_requerida_g: '12000'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /elaboraciones:
    get:
      tags: [Recetas]
      operationId: listFeedManufactures
      summary: Historial paginado de elaboraciones, más recientes primero
      description: >-
        Requiere autenticación y sesión válida; permiso específico pendiente por decisión
        del usuario. Para sesión compartida nativa exige Bearer, X-Shared-Device-Token
        y X-GAM-Session vigentes; web usa sesión stateful, gam_shared_device y
        X-GAM-Session. Las escrituras web conservan CSRF. No hay asignaciones por UP.
      parameters:
        - name: receta_id
          in: query
          description: ID de receta, incluida una receta inactiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: up_id
          in: query
          description: ID de unidad productiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: planta_id
          in: query
          description: ID de planta seleccionada.
          schema: {type: integer, minimum: 1, format: int64}
        - name: por_pagina
          in: query
          description: Tamaño de página entre 1 y 100; predeterminado 25.
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: page
          in: query
          description: Página entre 1 y 1000000.
          schema: {type: integer, minimum: 1, maximum: 1000000}
        - name: estado
          in: query
          description: Estado derivado de la existencia de cancelación.
          schema: {type: string, enum: [elaborada, cancelada]}
      responses:
        '200': {$ref: '#/components/responses/FeedOperationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Recetas]
      operationId: manufactureFeed
      summary: Elabora alimento inmediatamente usando la composición vigente
      description: >-
        Autenticación y contexto compartido vigentes; no requiere un permiso funcional
        específico por ahora. Receta e ingredientes activos y planta operativa.
        Deriva UP de la planta seleccionada. Consume primero su stock positivo;
        luego otras plantas operativas de la misma UP por saldo ascendente de
        cada ingrediente y, en empate, por ID de planta ascendente.
        Bloquea en orden técnico fijo antes de decidir el consumo. Un cálculo previo
        no reserva ni congela la composición. Rechaza stock insuficiente sin efectos
        parciales ni saldos negativos de ingredientes. Acredita alimento por receta
        y UP y conserva instantánea y distribución. Fecha y hora del registro;
        sin campos retroactivos. Idempotencia por actor, tipo y contenido normalizado;
        replay devuelve la operación original con su cancelación actual.
        Múltiplo inválido o límites calculados producen 409; entradas inválidas 422.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receta_id, planta_id, cantidad_g]
              properties:
                receta_id: {type: integer, format: int64, minimum: 1}
                planta_id: {type: integer, format: int64, minimum: 1}
                cantidad_g: {$ref: '#/components/schemas/StockPositiveGrams'}
            example: {receta_id: 1, planta_id: 2, cantidad_g: '26000'}
      responses:
        '201': {$ref: '#/components/responses/FeedOperationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /elaboraciones/{operation}:
    parameters:
      - {$ref: '#/components/parameters/FeedOperationId'}
    get:
      tags: [Recetas]
      operationId: getFeedManufacture
      summary: Detalle histórico, distribución y cancelación de una elaboración
      description: >-
        Requiere autenticación y sesión válida; permiso específico pendiente por decisión
        del usuario. Para sesión compartida nativa exige Bearer, X-Shared-Device-Token
        y X-GAM-Session vigentes; web usa sesión stateful, gam_shared_device y
        X-GAM-Session. Las escrituras web conservan CSRF. No hay asignaciones por UP.
      responses:
        '200': {$ref: '#/components/responses/FeedOperationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /elaboraciones/{operation}/cancelacion:
    parameters:
      - {$ref: '#/components/parameters/FeedOperationId'}
    post:
      tags: [Recetas]
      operationId: cancelFeedManufacture
      summary: Cancela una vez mediante devoluciones exactas y débito de alimento
      description: >-
        Autenticación y contexto compartido vigentes; no requiere un permiso funcional
        específico por ahora. Devuelve exactamente a las plantas originales sin
        recalcular la fórmula actual. Exige que todos los receptores estén operativos
        y que el alimento resultante no sea negativo. Permite receta e ingredientes
        desactivados sin reactivarlos. Conserva la historia original y crea operación,
        movimiento y auditoría compensatorios. No admite reversión genérica del movimiento
        de elaboración. La misma clave y motivo devuelve la elaboración cancelada sin
        repetir efectos; otra cancelación produce 409.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties:
                motivo: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/FeedOperationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /saldos-alimento:
    get:
      tags: [Recetas]
      operationId: listFeedBalances
      summary: Saldos acumulados materializados por receta y UP, incluidas recetas inactivas
      description: >-
        Requiere autenticación y sesión válida; permiso específico pendiente por decisión
        del usuario. Para sesión compartida nativa exige Bearer, X-Shared-Device-Token
        y X-GAM-Session vigentes; web usa sesión stateful, gam_shared_device y
        X-GAM-Session. Las escrituras web conservan CSRF. No hay asignaciones por UP.
        Incluye cuentas materializadas al configurar mínimos aunque no tengan movimientos.
        Un mínimo null indica sin configurar. Requieren atención los saldos iguales
        o inferiores a un mínimo configurado; no se generan notificaciones en esta consulta.
      parameters:
        - name: receta_id
          in: query
          description: ID de receta, incluida una receta inactiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: up_id
          in: query
          description: ID de unidad productiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: requiere_atencion
          in: query
          description: 1 devuelve saldos en mínimo o por debajo; 0 devuelve suficientes o sin configurar. Omitido devuelve todos.
          schema: {type: integer, enum: [0, 1]}
        - name: por_pagina
          in: query
          description: Tamaño de página entre 1 y 100; predeterminado 25.
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: page
          in: query
          description: Página entre 1 y 1000000.
          schema: {type: integer, minimum: 1, maximum: 1000000}
      responses:
        '200':
          description: Cuentas paginadas por ID descendente; sin separación por planta, versión o partida.
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/FeedBalance'}}
                  links: {type: object}
                  meta: {type: object}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /unidades-productivas/{productionUnit}/recetas/{recipe}/saldo:
    parameters:
      - {$ref: '#/components/parameters/ProductionUnitId'}
      - {$ref: '#/components/parameters/RecipeId'}
    get:
      tags: [Recetas]
      operationId: getFeedBalance
      summary: Consulta saldo por receta y UP; cero si todavía no existe cuenta
      description: >-
        Requiere autenticación y sesión válida; permiso específico pendiente por decisión
        del usuario. Para sesión compartida nativa exige Bearer, X-Shared-Device-Token
        y X-GAM-Session vigentes; web usa sesión stateful, gam_shared_device y
        X-GAM-Session. Las escrituras web conservan CSRF. No hay asignaciones por UP.
      responses:
        '200':
          description: Saldo exacto, sin materializar filas durante una consulta.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/FeedBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /unidades-productivas/{productionUnit}/recetas/{recipe}/minimo:
    parameters:
      - {$ref: '#/components/parameters/ProductionUnitId'}
      - {$ref: '#/components/parameters/RecipeId'}
    patch:
      tags: [Recetas]
      operationId: setFeedBalanceMinimum
      summary: Configura o quita el mínimo de alimento por receta y UP
      description: >-
        Requiere autenticación, sesión válida e inventory.manage o rol admin.
        Funciona con recetas activas o inactivas y sin movimientos anteriores.
        Materializa una cuenta en cero si todavía no existe, sin acreditar ni
        descontar alimento. minimo_g admite gramos enteros entre 0 y 999999999999;
        null deja el mínimo sin configurar. No requiere Idempotency-Key.
        Repetir la asignación conserva el estado y registra una nueva auditoría.
        La auditoría comparte transacción con el mínimo; la evaluación para futuras
        alertas se publica sólo tras confirmar la transacción. No envía notificaciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minimo_g]
              properties:
                minimo_g:
                  oneOf:
                    - {type: string, pattern: '^[0-9]+$', description: Gramos enteros no negativos hasta 999999999999.}
                    - {type: integer, minimum: 0, maximum: 999999999999}
                    - {type: 'null'}
            example: {minimo_g: '300000'}
      responses:
        '200':
          description: Saldo actual, mínimo y estado evaluado; la cantidad de alimento no cambia.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/FeedBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /unidades-productivas/{productionUnit}/recetas/{recipe}/ajustes:
    parameters:
      - {$ref: '#/components/parameters/ProductionUnitId'}
      - {$ref: '#/components/parameters/RecipeId'}
    post:
      tags: [Recetas]
      operationId: adjustFeedBalance
      summary: Ajusta alimento independientemente de ingredientes y elaboraciones
      description: >-
        Autenticación y contexto compartido vigentes; no requiere un permiso funcional
        específico por ahora. Sólo recetas activas. Sumar/restar requieren magnitud
        positiva. Establecer acepta cero, positivos y negativos. No consume ni devuelve
        ingredientes. Cuenta por receta y UP. Un ajuste sin diferencia registra motivo
        y auditoría igualmente. Idempotencia por actor y contenido normalizado.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedAdjustmentInput'}
            example: {accion: establecer, valor_g: '-1000', motivo: Recuento físico}
      responses:
        '201': {$ref: '#/components/responses/FeedOperationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /plantas-racion/{poultryHouse}/ingredientes/{product}/ajustes:
    parameters:
      - name: poultryHouse
        in: path
        required: true
        description: ID de planta de ración operativa.
        schema: {type: integer, format: int64, minimum: 1}
      - name: product
        in: path
        required: true
        description: ID de materia prima activa con stock en gramos.
        schema: {type: integer, format: int64, minimum: 1}
    post:
      tags: [Recetas]
      operationId: adjustFeedIngredient
      summary: Ajusta ingrediente de una planta independientemente del alimento
      description: >-
        Autenticación y contexto compartido vigentes; no requiere un permiso funcional
        específico por ahora. Planta operativa e ingrediente activo. Sumar/restar
        requieren magnitud positiva; establecer acepta cero y positivos. Rechaza
        cualquier resultado negativo. Mantiene las fracciones existentes con seis
        decimales, sin redondeo. No modifica alimento ni elaboraciones históricas.
        Un ajuste sin delta registra historial y auditoría sin una línea de inventario
        nula. Idempotencia por actor y contenido normalizado.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IngredientAdjustmentInput'}
            example: {accion: sumar, valor_g: '1000', motivo: Corrección de recuento}
      responses:
        '201': {$ref: '#/components/responses/FeedOperationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /ajustes-alimentacion:
    get:
      tags: [Recetas]
      operationId: listFeedAdjustments
      summary: Historial paginado de ajustes independientes con motivo y saldos
      description: >-
        Requiere autenticación y sesión válida; permiso específico pendiente por decisión
        del usuario. Para sesión compartida nativa exige Bearer, X-Shared-Device-Token
        y X-GAM-Session vigentes; web usa sesión stateful, gam_shared_device y
        X-GAM-Session. Las escrituras web conservan CSRF. No hay asignaciones por UP.
      parameters:
        - name: receta_id
          in: query
          description: ID de receta, incluida una receta inactiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: up_id
          in: query
          description: ID de unidad productiva.
          schema: {type: integer, minimum: 1, format: int64}
        - name: planta_id
          in: query
          description: ID de planta seleccionada.
          schema: {type: integer, minimum: 1, format: int64}
        - name: producto_id
          in: query
          description: ID de ingrediente, aplicable a ajustes de ingredientes.
          schema: {type: integer, minimum: 1, format: int64}
        - name: por_pagina
          in: query
          description: Tamaño de página entre 1 y 100; predeterminado 25.
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: page
          in: query
          description: Página entre 1 y 1000000.
          schema: {type: integer, minimum: 1, maximum: 1000000}
        - name: tipo
          in: query
          description: Destino del ajuste.
          schema: {type: string, enum: [ingrediente, alimento]}
      responses:
        '200': {$ref: '#/components/responses/FeedOperationPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: laravel_session}
  parameters:
    FeedOperationId:
      name: operation
      in: path
      required: true
      description: ID interno de elaboración, independiente del UUID de operación.
      schema: {type: integer, format: int64, minimum: 1}
    ProductionUnitId:
      name: productionUnit
      in: path
      required: true
      description: ID de unidad productiva; sin asignaciones de usuarios.
      schema: {type: integer, format: int64, minimum: 1}
    RecipeId:
      name: recipe
      in: path
      required: true
      description: ID interno estable de la receta; los nombres no son únicos.
      schema: {type: integer, format: int64, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por actor para alta y nuevas operaciones; no se admite en el cuerpo.
      schema: {type: string, format: uuid}
  schemas:
    StockSignedGrams:
      description: "Gramos enteros exactos dentro del rango del inventario decimal(18,6); no floats, fracciones ni notación científica. Máximo absoluto 999999999999."
      oneOf: [{"type":"integer","format":"int64","minimum":-999999999999,"maximum":999999999999},{"type":"string","pattern":"^-?[0-9]+$"}]
    StockNonnegativeGrams:
      description: "Gramos enteros exactos dentro del rango del inventario decimal(18,6); no floats, fracciones ni notación científica. Máximo absoluto 999999999999."
      oneOf: [{"type":"integer","format":"int64","minimum":0,"maximum":999999999999},{"type":"string","pattern":"^[0-9]+$"}]
    StockPositiveGrams:
      description: "Gramos enteros exactos dentro del rango del inventario decimal(18,6); no floats, fracciones ni notación científica. Máximo absoluto 999999999999."
      oneOf: [{"type":"integer","format":"int64","minimum":1,"maximum":999999999999},{"type":"string","pattern":"^(?=[0-9]*[1-9])[0-9]+$"}]
    FeedAdjustmentInput:
      type: "object"
      additionalProperties: false
      required: ["accion","valor_g","motivo"]
      properties:
        accion:
          type: "string"
          enum: ["sumar","restar","establecer"]
        valor_g:
          $ref: "#/components/schemas/StockSignedGrams"
        motivo:
          type: "string"
          minLength: 1
          maxLength: 2000
      allOf: [{"if":{"properties":{"accion":{"enum":["sumar","restar"]}}},"then":{"properties":{"valor_g":{"$ref":"#/components/schemas/StockPositiveGrams"}}}}]
    IngredientAdjustmentInput:
      type: "object"
      additionalProperties: false
      required: ["accion","valor_g","motivo"]
      properties:
        accion:
          type: "string"
          enum: ["sumar","restar","establecer"]
        valor_g:
          $ref: "#/components/schemas/StockNonnegativeGrams"
        motivo:
          type: "string"
          minLength: 1
          maxLength: 2000
      allOf: [{"if":{"properties":{"accion":{"enum":["sumar","restar"]}}},"then":{"properties":{"valor_g":{"$ref":"#/components/schemas/StockPositiveGrams"}}}}]
    FeedBalance:
      type: "object"
      required: ["receta_id","nombre_receta","estado_receta","up_id","nombre_up","saldo_g","minimo_g","estado_stock","requiere_atencion"]
      properties:
        receta_id:
          type: "integer"
          format: "int64"
        nombre_receta:
          type: "string"
        estado_receta:
          $ref: "#/components/schemas/RecipeStatus"
        up_id:
          type: "integer"
          format: "int64"
        nombre_up:
          type: "string"
        saldo_g:
          type: "string"
          pattern: "^-?[0-9]+$"
          description: "Saldo entero acumulado por receta y UP; puede ser cero o negativo."
        minimo_g:
          type: [string, 'null']
          pattern: '^[0-9]+$'
          description: Mínimo configurado en gramos enteros entre 0 y 999999999999; null significa sin configurar.
        estado_stock:
          type: string
          enum: [sin_configurar, suficiente, en_minimo, por_debajo]
          description: Sin configurar si el mínimo es null; suficiente si saldo es mayor; en mínimo si son iguales; por debajo si es menor.
        requiere_atencion:
          type: boolean
          description: Verdadero cuando hay un mínimo configurado y el saldo es igual o inferior a él.
    FeedOperation:
      type: "object"
      required: ["id","operacion_id","tipo","receta_id","up_id","planta_id","producto_id","cantidad_g","factor","accion","motivo","saldo_anterior_g","saldo_resultante_g","delta_g","movimiento_id","cancela_id","actor_id","registrado_en","nombre_receta","nombre_planta","nombre_producto","sku","rendimiento_g","estado","ingredientes","distribucion"]
      properties:
        id:
          type: "integer"
          format: "int64"
        operacion_id:
          type: "string"
          format: "uuid"
        tipo:
          type: "string"
          enum: ["elaboracion","cancelacion","ajuste_ingrediente","ajuste_alimento"]
        receta_id:
          type: ["integer","null"]
          format: "int64"
        up_id:
          type: "integer"
          format: "int64"
        planta_id:
          type: ["integer","null"]
          format: "int64"
        producto_id:
          type: ["integer","null"]
          format: "int64"
        cantidad_g:
          type: "string"
          pattern: "^-?[0-9]+$"
        factor:
          type: ["string","null"]
          pattern: "^[1-9][0-9]*$"
        accion:
          type: ["string","null"]
          enum: ["sumar","restar","establecer",null]
        motivo:
          type: ["string","null"]
        saldo_anterior_g:
          type: "string"
          description: "Entero para alimento; decimal con seis posiciones para ingredientes."
        saldo_resultante_g:
          type: "string"
          description: "Entero para alimento; decimal con seis posiciones para ingredientes."
        delta_g:
          type: "string"
          description: "Diferencia exacta con signo; establecer alimento admite hasta 1999999999998 gramos de diferencia."
        movimiento_id:
          type: ["integer","null"]
          format: "int64"
          description: "Movimiento genérico de ingredientes; alimento usa esta propia operación como movimiento."
        cancela_id:
          type: ["integer","null"]
          format: "int64"
        actor_id:
          type: "integer"
          format: "int64"
        registrado_en:
          type: "string"
          format: "date-time"
        nombre_receta:
          type: ["string","null"]
        nombre_planta:
          type: ["string","null"]
        nombre_producto:
          type: ["string","null"]
        sku:
          type: ["string","null"]
        rendimiento_g:
          type: ["string","null"]
        estado:
          type: ["string","null"]
          enum: ["elaborada","cancelada",null]
        ingredientes:
          type: "array"
          description: "Composición histórica utilizada, conservada al editar o desactivar."
          items:
            type: "object"
            required: ["producto_id","nombre","sku","cantidad_base_g","cantidad_requerida_g"]
            properties:
              producto_id:
                type: "integer"
                format: "int64"
              nombre:
                type: "string"
              sku:
                type: "string"
              cantidad_base_g:
                $ref: "#/components/schemas/GramsOutput"
              cantidad_requerida_g:
                $ref: "#/components/schemas/GramsOutput"
        distribucion:
          type: "array"
          description: "Cantidades históricas por ingrediente y planta. En elaboración referencia líneas del descuento; en cancelación, líneas de su movimiento compensatorio."
          items:
            type: "object"
            required: ["producto_id","planta_id","nombre_planta","ubicacion_id","cantidad_g","linea_movimiento_id","saldo_anterior_g","saldo_resultante_g"]
            properties:
              producto_id:
                type: "integer"
                format: "int64"
              planta_id:
                type: "integer"
                format: "int64"
              nombre_planta:
                type: "string"
              ubicacion_id:
                type: "integer"
                format: "int64"
              cantidad_g:
                type: "string"
                pattern: "^[0-9]+\\.[0-9]{6}$"
                description: "Cantidad positiva exacta con la precisión existente."
              linea_movimiento_id:
                type: "integer"
                format: "int64"
                description: "Línea del movimiento indicado por movimiento_id en esta operación; la devolución usa su propia línea compensatoria."
              saldo_anterior_g:
                type: "string"
                description: "Saldo de esa planta e ingrediente antes del descuento o devolución, con seis decimales."
              saldo_resultante_g:
                type: "string"
                description: "Saldo de esa planta e ingrediente después del descuento o devolución, con seis decimales."
        cancelacion:
          description: "Operación compensatoria completa; nula si no se canceló."
          anyOf: [{"$ref":"#/components/schemas/FeedOperation"},{"type":"null"}]
    GramsInput:
      description: >-
        Gramos enteros positivos entre 1 y 9223372036854775807.
        Usar cadenas de dígitos para evitar pérdida de precisión en JavaScript.
        No se aceptan floats, fracciones, separadores ni notación científica;
        un número JSON escrito con punto decimal también se rechaza.
      oneOf:
        - {type: string, pattern: '^(?=[0-9]*[1-9])[0-9]+$', minLength: 1}
        - {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    GramsOutput:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 19
      description: Gramos exactos expresados como cadena canónica de dígitos hasta 9223372036854775807.
    RecipeStatus:
      type: string
      enum: [active, inactive]
      description: Estado activo o inactivo; se conserva el registro.
    IngredientInput:
      type: object
      additionalProperties: false
      required: [producto_id, cantidad_g]
      properties:
        producto_id:
          type: integer
          format: int64
          minimum: 1
          description: ID de un producto existente de tipo raw_material, en gramos y con control de stock.
        cantidad_g: {$ref: '#/components/schemas/GramsInput'}
    IngredientList:
      type: array
      minItems: 1
      maxItems: 1000
      description: Cada producto aparece una sola vez.
      items: {$ref: '#/components/schemas/IngredientInput'}
    CreateRecipe:
      type: object
      additionalProperties: false
      required: [nombre, rendimiento_g, ingredientes]
      properties:
        nombre: {type: string, minLength: 1, maxLength: 160, description: Nombre visible; puede repetirse.}
        nota: {type: [string, 'null'], maxLength: 5000, description: Nota opcional.}
        rendimiento_g: {$ref: '#/components/schemas/GramsInput'}
        ingredientes: {$ref: '#/components/schemas/IngredientList'}
    Recipe:
      type: object
      required: [id, nombre, nota, rendimiento_g, estado, ingredientes, creado_en, actualizado_en]
      properties:
        id: {type: integer, format: int64, description: ID estable de receta.}
        nombre: {type: string}
        nota: {type: [string, 'null']}
        rendimiento_g: {$ref: '#/components/schemas/GramsOutput'}
        estado: {$ref: '#/components/schemas/RecipeStatus'}
        ingredientes:
          type: array
          items:
            type: object
            required: [producto_id, nombre, sku, cantidad_g]
            properties:
              producto_id: {type: integer, format: int64}
              nombre: {type: string}
              sku: {type: string}
              cantidad_g: {$ref: '#/components/schemas/GramsOutput'}
        creado_en: {type: string, format: date-time}
        actualizado_en: {type: string, format: date-time}
    Calculation:
      type: object
      required: [receta_id, rendimiento_g, cantidad_g, factor, ingredientes]
      properties:
        receta_id: {type: integer, format: int64}
        rendimiento_g: {$ref: '#/components/schemas/GramsOutput'}
        cantidad_g: {$ref: '#/components/schemas/GramsOutput'}
        factor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Número entero positivo de combinaciones base, expresado sin pérdida de precisión.
        ingredientes:
          type: array
          items:
            type: object
            required: [producto_id, nombre, cantidad_base_g, cantidad_requerida_g]
            properties:
              producto_id: {type: integer, format: int64}
              nombre: {type: string}
              cantidad_base_g: {$ref: '#/components/schemas/GramsOutput'}
              cantidad_requerida_g: {$ref: '#/components/schemas/GramsOutput'}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string, description: Mensaje en español.}
        errors:
          type: object
          description: Errores de validación por campo.
          additionalProperties:
            type: array
            items: {type: string}
  responses:
    FeedOperationResponse:
      description: "Operación histórica con instantánea, saldos y referencias."
      content:
        application/json:
          schema:
            type: "object"
            required: ["data"]
            properties:
              data:
                $ref: "#/components/schemas/FeedOperation"
    FeedOperationPage:
      description: "Operaciones por ID descendente con paginación."
      content:
        application/json:
          schema:
            type: "object"
            required: ["data","links","meta"]
            properties:
              data:
                type: "array"
                items:
                  $ref: "#/components/schemas/FeedOperation"
              links:
                type: "object"
              meta:
                type: "object"
    RecipeResponse:
      description: Receta global y composición actual.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Recipe'}
    Unauthorized:
      description: Sesión personal o compartida inválida o ausente.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: El usuario no tiene el permiso funcional requerido.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: El recurso solicitado no existe.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflicto de estado, composición o clave de idempotencia.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Campos, gramos, factor o resultado calculado inválidos.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
