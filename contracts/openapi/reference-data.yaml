openapi: 3.1.0
info:
  title: API de opciones de reference
  version: 1.0.0
  description: |
    Catálogos vivos para construir formularios y filtros sin pedir al usuario
    que memorice identificadores. Cada lista respeta los permisos de lectura
    del usuario autenticado.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Referencias
    description: Opciones de entidades, estados y valores de dominio.
paths:
  /reference/options:
    get:
      tags: [Referencias]
      operationId: listarOpcionesDeReferencia
      summary: Lista las opciones disponibles para formularios y filtros
      description: |
        Devuelve listas actualizadas desde la base de datos y los enums del
        backend. Las listas que el usuario no puede consultar se devuelven
        vacías. Los valores de las opciones deben enviarse en los comandos,
        nunca las etiquetas mostradas.
      responses:
        '200':
          description: Opciones disponibles para el usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ReferenceOptions'
        '401': { $ref: '#/components/responses/Unauthenticated' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Option:
      type: object
      required: [value, label]
      properties:
        value:
          oneOf:
            - type: integer
            - type: string
        label: { type: string }
    OptionMap:
      type: object
      additionalProperties:
        type: array
        items: { $ref: '#/components/schemas/Option' }
    ReferenceOptions:
      type: object
      required: [departments, localities, production_units, poultry_houses, suppliers, products, stock_locations, inventory_balances, movements, types, statuses, audit]
      properties:
        departments: { type: array, items: { $ref: '#/components/schemas/Option' } }
        localities: { type: array, items: { $ref: '#/components/schemas/Option' } }
        production_units: { type: array, items: { $ref: '#/components/schemas/Option' } }
        poultry_houses: { type: array, items: { $ref: '#/components/schemas/Option' } }
        suppliers: { type: array, items: { $ref: '#/components/schemas/Option' } }
        products: { type: array, items: { $ref: '#/components/schemas/Option' } }
        stock_locations: { type: array, items: { $ref: '#/components/schemas/Option' } }
        inventory_balances: { type: array, items: { $ref: '#/components/schemas/Option' } }
        movements: { type: array, items: { $ref: '#/components/schemas/Option' } }
        types: { $ref: '#/components/schemas/OptionMap' }
        statuses: { $ref: '#/components/schemas/OptionMap' }
        audit:
          type: object
          required: [events, sources]
          properties:
            events: { type: array, items: { $ref: '#/components/schemas/Option' } }
            sources: { type: array, items: { $ref: '#/components/schemas/Option' } }
  responses:
    Unauthenticated:
      description: El token no existe o ya no es válido.
