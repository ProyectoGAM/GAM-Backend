openapi: 3.1.0
info:
  title: GAM Delivery API
  version: 1.0.0
  description: Operación móvil de repartos, sincronización offline y monitoreo administrativo.
servers:
  - url: /
tags:
  - name: Repartos
  - name: Inventario
paths:
  /api/v1/repartos/unidades-productivas:
    get:
      tags: [Repartos]
      summary: Lista UP operativas para elegir el origen de cada carga
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
      responses:
        '200':
          description: UP accesibles con permiso de lectura de reparto, sin asignaciones por usuario
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DeliveryProductionUnit' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/inventario/presentaciones-huevos:
    get:
      tags: [Inventario]
      summary: Consulta el catálogo global y su bloqueo; solo administrador
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Los precios nulos corresponden a definiciones anteriores aún sin configurar
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeliveryUnit' } }
                  meta: { type: object, properties: { locked: { type: boolean } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inventario]
      summary: Crea una presentación con equivalencia y precio entero en UYU
      description: Solo administrador. Todas las escrituras del catálogo están bloqueadas si existe cualquier reparto activo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EggPresentationInput' }
      responses:
        '201':
          description: Presentación creada y auditada
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/DeliveryUnit' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/inventario/presentaciones-huevos/{presentation}:
    patch:
      tags: [Inventario]
      summary: Modifica nombre, equivalencia o precio de una presentación
      description: Solo administrador. Conserva el identificador y no altera las copias históricas. Bloqueado mientras haya cualquier reparto activo.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: presentation, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                eggs_per_unit: { type: integer, minimum: 1, maximum: 2147483647 }
                default_unit_price: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: Presentación actualizada y auditada
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/DeliveryUnit' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/repartos:
    post:
      tags: [Repartos]
      summary: Inicia un reparto y reserva la carga de huevos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartDelivery' }
      responses:
        '201': { $ref: '#/components/responses/Delivery' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Repartos]
      summary: Lista repartos actuales e históricos
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, completed, cancelled] } }
        - { name: driver_id, in: query, schema: { type: integer } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/DeliveryPage' }
  /api/v1/repartos/actuales:
    get:
      tags: [Repartos]
      summary: Lista los repartos activos para monitoreo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/DeliveryPage' }
  /api/v1/repartos/clientes:
    get:
      tags: [Repartos]
      summary: Consulta clientes disponibles sin asignarlos a un reparto ni fijar un orden de visita
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 50 } }
      responses:
        '200':
          description: Catálogo acotado de clientes disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeliveryClient' } }
  /api/v1/repartos/unidades:
    get:
      tags: [Repartos]
      summary: Obtiene las presentaciones y equivalencias vigentes para cargar huevos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Catálogo autoritativo de conversiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeliveryUnit' } }
  /api/v1/repartos/{reparto}:
    get:
      tags: [Repartos]
      summary: Consulta el detalle de un reparto
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reparto, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Delivery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repartos/{reparto}/entregas:
    post:
      tags: [Repartos]
      summary: Registra o reintenta una visita a un cliente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reparto, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryStopInput' }
      responses:
        '200': { $ref: '#/components/responses/DeliveryStop' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/repartos/{reparto}/cargas:
    post:
      tags: [Repartos]
      summary: Agrega una carga de huevos durante un reparto activo y actualiza inventario
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reparto, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDeliveryLoad' }
      responses:
        '200': { $ref: '#/components/responses/Delivery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/repartos/{reparto}/ubicaciones/lote:
    post:
      tags: [Repartos]
      summary: Publica un lote de posiciones GPS con deduplicación por evento
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reparto, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locations]
              properties:
                locations:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/DeliveryLocationInput' }
      responses:
        '200':
          description: Resultado de aceptación del lote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [accepted, duplicates, pending]
                    properties:
                      accepted: { type: integer }
                      duplicates: { type: integer }
                      pending: { type: integer }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/repartos/{reparto}/cierre:
    post:
      tags: [Repartos]
      summary: Cierra el reparto y registra el sobrante como devolución al stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: reparto, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseDelivery' }
      responses:
        '200': { $ref: '#/components/responses/Delivery' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    StartDelivery:
      type: object
      required: [pin, production_unit_id]
      description: Enviar items para cargas con presentaciones; quantity se conserva para clientes anteriores. No enviar ambos.
      properties:
        pin: { type: string, pattern: '^[0-9]{4}$', description: PIN personal del repartidor; se valida en el servidor y no se guarda en el reparto }
        production_unit_id: { type: integer, minimum: 1, description: UP operativa de la carga inicial; obligatoria también en desarrollo }
        quantity: { type: integer, minimum: 1, description: 'Formato anterior: huevos sueltos' }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/DeliveryLoadItemInput' } }
        vehicle_reference: { type: string, maxLength: 120 }
    AddDeliveryLoad:
      type: object
      required: [production_unit_id]
      description: Enviar items o quantity, nunca ambos.
      properties:
        production_unit_id: { type: integer, minimum: 1, description: UP de esta recarga; puede diferir del origen inicial }
        quantity: { type: integer, minimum: 1, description: 'Formato anterior: huevos sueltos' }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/DeliveryLoadItemInput' } }
    DeliveryUnit:
      type: object
      required: [id, label, category, eggs_per_unit, default_unit_price, currency]
      properties:
        id: { type: string }
        label: { type: string }
        category: { type: string }
        eggs_per_unit: { type: integer, minimum: 1 }
        default_unit_price: { type: integer, nullable: true, minimum: 0, description: Precio en UYU; nulo únicamente mientras se configura una definición importada }
        currency: { type: string, enum: [UYU] }
    DeliveryProductionUnit:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    EggPresentationInput:
      type: object
      required: [name, eggs_per_unit, default_unit_price]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        eggs_per_unit: { type: integer, minimum: 1, maximum: 2147483647 }
        default_unit_price: { type: integer, minimum: 0, maximum: 2147483647, description: Precio de venta por presentación en pesos uruguayos enteros }
    ExactDeliveryAmount:
      type: string
      pattern: '^[0-9]+[.][0-9]{3}$'
      description: Importe exacto en UYU, transmitido como texto y conservado con tres decimales; ejemplo 12.625, sin redondear
      example: '12.625'
    DeliveryStopItemInput:
      allOf:
        - $ref: '#/components/schemas/DeliveryLoadItemInput'
        - type: object
          properties:
            unit_price: { type: integer, minimum: 0, maximum: 2147483647, description: Precio aplicado a esta entrega en pesos enteros; si se omite se usa el predeterminado compatible. Si no hay precio configurado debe indicarse explícitamente. }
    DeliveryReturnItem:
      allOf:
        - $ref: '#/components/schemas/DeliveryLoadItemInput'
        - type: object
          properties:
            label: { type: string, description: Nombre conservado de la carga }
            eggs: { type: integer, minimum: 1 }
    DeliveryLoadItemInput:
      type: object
      required: [unit, amount, eggs_per_unit]
      properties:
        unit: { type: string, description: Identificador del catálogo /repartos/unidades }
        amount: { type: string, pattern: '^[0-9]{1,10}([.][0-9]{1,3})?$', description: 'Acepta cantidades fraccionarias como 0.5' }
        eggs_per_unit: { type: integer, minimum: 1, description: Equivalencia mostrada al registrar; el servidor rechaza valores desactualizados }
    DeliveryLoadItem:
      allOf:
        - $ref: '#/components/schemas/DeliveryLoadItemInput'
        - type: object
          properties:
            label: { type: string }
            category: { type: string }
            eggs: { type: integer, minimum: 1 }
    DeliveryStopItem:
      allOf:
        - $ref: '#/components/schemas/DeliveryStopItemInput'
        - type: object
          required: [label, eggs]
          properties:
            label: { type: string }
            eggs: { type: integer, minimum: 1 }
            line_amount: { $ref: '#/components/schemas/ExactDeliveryAmount', nullable: true }
    DeliveryUnitBalanceRow:
      type: object
      required: [unit, label, eggs_per_unit, loaded_amount, delivered_amount, remaining_amount, loaded_eggs, delivered_eggs]
      properties:
        unit: { type: string }
        label: { type: string }
        eggs_per_unit: { type: integer, minimum: 1, description: Equivalencia conservada de la carga }
        loaded_amount: { type: string, description: Cantidad exacta en esta presentación }
        delivered_amount: { type: string, description: Cantidad entregada en esta presentación }
        returned_amount: { type: string, description: Cantidad descargada al cerrar en esta presentación }
        remaining_amount: { type: string, nullable: true, description: Nulo si existen entregas o devoluciones antiguas sin presentación }
        loaded_eggs: { type: integer }
        delivered_eggs: { type: integer }
    DeliveryUnitBalances:
      type: object
      required: [rows, unallocated_delivered_eggs, unallocated_returned_eggs]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/DeliveryUnitBalanceRow' } }
        unallocated_delivered_eggs: { type: integer, description: Huevos de entregas antiguas sin presentación; no se asignan a una unidad por suposición }
        unallocated_returned_eggs: { type: integer }
    DeliveryClient:
      type: object
      required: [id, name, address, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    DeliveryStopInput:
      type: object
      required: [client_reference, status]
      properties:
        client_reference: { type: string, maxLength: 80 }
        status: { type: string, enum: [delivered, not_delivered] }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/DeliveryStopItemInput' }, description: 'Obligatorio para delivered y prohibido para not_delivered. El servidor calcula los huevos desde la equivalencia registrada en la carga.' }
        visit_reason: { type: string, nullable: true, maxLength: 120 }
        notes: { type: string, nullable: true, maxLength: 2000 }
    DeliveryLocationInput:
      type: object
      required: [client_event_id, latitude, longitude, captured_at]
      properties:
        client_event_id: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0 }
        speed: { type: number, nullable: true, minimum: 0 }
        captured_at: { type: string, format: date-time }
    CloseDelivery:
      type: object
      required: [pin]
      description: Enviar returned_items para la descarga por presentaciones. La descarga debe incluir todos los huevos sobrantes para cerrar el reparto. returned_quantity se conserva para cierres anteriores sin desglose; no enviar ambos.
      oneOf:
        - required: [returned_items]
        - required: [returned_quantity]
      properties:
        pin: { type: string, pattern: '^[0-9]{4}$', description: PIN personal del repartidor; el cierre requiere conexión y no se encola }
        returned_quantity: { type: integer, minimum: 0, description: Formato anterior en huevos; no reconstruye presentaciones }
        returned_items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/DeliveryLoadItemInput' }, description: Cantidades de las presentaciones cargadas; acepta fracciones que equivalen a huevos enteros. Lista vacía si no hay devolución. }
        return_production_unit_id: { type: integer, nullable: true, description: Destino único de todos los sobrantes; debe pertenecer a las UP de las cargas. Obligatorio para una devolución cuando hay varias UP de origen. }
        notes: { type: string, nullable: true, maxLength: 2000 }
    Delivery:
      type: object
      required: [id, status, loaded_quantity, delivered_quantity, returned_quantity, remaining_quantity, stops_summary]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, completed, cancelled] }
        driver: { type: object, nullable: true }
        production_unit: { type: object, nullable: true, description: UP inicial conservada para compatibilidad; cada carga expone su propio origen }
        vehicle_reference: { type: string, nullable: true }
        loaded_quantity: { type: integer }
        delivered_quantity: { type: integer }
        returned_quantity: { type: integer }
        returned_items: { type: array, nullable: true, items: { $ref: '#/components/schemas/DeliveryReturnItem' } }
        return_production_unit: { $ref: '#/components/schemas/DeliveryProductionUnit', nullable: true }
        delivered_amount: { $ref: '#/components/schemas/ExactDeliveryAmount', nullable: true, description: Valor de mercadería entregada; nulo si hay entregas históricas sin precios }
        currency: { type: string, enum: [UYU] }
        remaining_quantity: { type: integer }
        unit_balances: { $ref: '#/components/schemas/DeliveryUnitBalances', description: Disponible cuando se consultan las cargas y visitas del reparto }
        stops_summary: { type: object }
        latest_location: { $ref: '#/components/schemas/DeliveryLocation', nullable: true }
        stops: { type: array, items: { $ref: '#/components/schemas/DeliveryStop' } }
        loads: { type: array, items: { $ref: '#/components/schemas/DeliveryLoad' } }
        locations: { type: array, items: { $ref: '#/components/schemas/DeliveryLocation' } }
    DeliveryStop:
      type: object
      required: [id, client_reference, status, delivered_quantity]
      properties:
        id: { type: integer }
        client_reference: { type: string }
        status: { type: string, enum: [pending, delivered, not_delivered] }
        delivered_quantity: { type: integer, minimum: 0 }
        total_amount: { $ref: '#/components/schemas/ExactDeliveryAmount', nullable: true }
        currency: { type: string, enum: [UYU] }
        items: { type: array, nullable: true, items: { $ref: '#/components/schemas/DeliveryStopItem' }, description: Nulo solo para registros de desarrollo anteriores sin detalle por presentación }
        visit_reason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        client_name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        sequence: { type: integer }
        visited_at: { type: string, format: date-time, nullable: true }
    DeliveryLoad:
      type: object
      properties:
        id: { type: integer }
        idempotency_key: { type: string, format: uuid }
        quantity: { type: integer }
        production_unit: { $ref: '#/components/schemas/DeliveryProductionUnit', nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/DeliveryLoadItem' } }
        type: { type: string }
        created_at: { type: string, format: date-time }
    DeliveryLocation:
      allOf:
        - $ref: '#/components/schemas/DeliveryLocationInput'
        - type: object
          properties:
            id: { type: integer }
            received_at: { type: string, format: date-time }
  responses:
    Delivery:
      description: Reparto
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: '#/components/schemas/Delivery' }, catalog: { type: array, items: { $ref: '#/components/schemas/DeliveryUnit' }, description: Catálogo confirmado al iniciar para conservar localmente } } }
    DeliveryPage:
      description: Repartos paginados
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/Delivery' } }
              meta: { type: object }
              links: { type: object }
    DeliveryStop:
      description: Visita registrada
      content:
        application/json:
          schema: { type: object, properties: { data: { $ref: '#/components/schemas/DeliveryStop' } } }
    Conflict:
      description: Conflicto de estado o idempotencia
    Forbidden:
      description: Permiso insuficiente
    NotFound:
      description: Recurso no encontrado
    ValidationError:
      description: Error de validación
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
