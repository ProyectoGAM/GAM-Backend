openapi: "3.1.0"
info:
  title: "06 — Pesajes"
  version: "1.0.0"
  description: "Registro, corrección, distribución y evolución histórica de pesajes de lotes. Las rutas públicas y los mensajes descriptivos están en español; los identificadores estables permanecen en inglés."
servers:
  - url: "/api/v1"
security:
  - bearerAuth: []
  - sanctumCookie: []
  - bearerAuth: []
    sharedDeviceHeader: []
    sharedSessionHeader: []
  - sanctumCookie: []
    sharedDeviceCookie: []
    sharedSessionHeader: []
tags:
  - name: "Pesajes"
    description: "Capturas individuales o grupales, correcciones y consultas históricas."
  - name: "Configuración de pesajes"
    description: "Rangos globales de referencia administrados con control optimista."
  - name: "Pesajes diarios"
    description: "Jornadas por lote y fecha local de America/Montevideo."
paths:
  "/pesajes-diarios":
    get:
      tags: ["Pesajes diarios"]
      operationId: listDailyWeighings
      summary: "Pagina las jornadas de un lote, de la fecha más reciente a la más antigua"
      description: "Permiso weighings.view. El cursor opaco evita omisiones cuando se agregan jornadas nuevas. Una lista vacía indica ausencia de datos."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/RequiredFlockFilter"
        - "$ref": "#/components/parameters/From"
        - "$ref": "#/components/parameters/To"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/PerPage"
      responses:
        "200": { description: "Página de jornadas.", content: { application/json: { schema: { "$ref": "#/components/schemas/DailyWeighingPage" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/lotes/{lote}/pesajes-diarios/{fecha}":
    get:
      tags: ["Pesajes diarios"]
      operationId: showDailyWeighingByDate
      summary: "Consulta la jornada de un lote por fecha local"
      description: "Permiso weighings.view. Devuelve 404 si no existe jornada para la fecha; status=closed si la fecha local ya terminó. Los ingresos se ordenan por hora e ID y usan cursor opaco."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/FlockPath"
        - "$ref": "#/components/parameters/LocalDatePath"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/PerPage"
      responses:
        "200": { description: "Jornada e ingresos.", content: { application/json: { schema: { "$ref": "#/components/schemas/DailyWeighingDetailResponse" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
  "/lotes/{lote}/pesajes-diarios/ingresos":
    post:
      tags: ["Pesajes diarios"]
      operationId: addDailyWeighingEntry
      summary: "Agrega un ingreso a la jornada local actual del lote"
      description: "Permiso weighings.manage. Cada ingreso usa gramos. La jornada se crea con el primer ingreso confirmado. Un 409 DAILY_WEIGHING_OUT_OF_RANGE_CONFIRMATION_REQUIRED no persiste nada; reintenta con la misma clave y confirm_out_of_range=true. Los grupos cuentan como un solo ingreso anómalo. Dos usuarios se serializan sobre el lote."
      security:
        - bearerAuth: []
        - sanctumCookie: []
          csrf: []
        - bearerAuth: []
          sharedDeviceHeader: []
          sharedSessionHeader: []
        - sanctumCookie: []
          sharedDeviceCookie: []
          sharedSessionHeader: []
          csrf: []
      x-permission: weighings.manage
      parameters:
        - "$ref": "#/components/parameters/FlockPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { "$ref": "#/components/schemas/AddDailyWeighingEntry" } } }
      responses:
        "201": { description: "Ingreso registrado o resultado idempotente.", content: { application/json: { schema: { "$ref": "#/components/schemas/DailyWeighingOperationResponse" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/pesajes-diarios/{jornada}":
    get:
      tags: ["Pesajes diarios"]
      operationId: showDailyWeighing
      summary: "Consulta la jornada y una página de sus ingresos"
      description: "Permiso weighings.view. La ausencia devuelve 404; la falta de permiso devuelve 403. La jornada permanece consultable cuando queda vacía tras eliminar ingresos."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/DailyWeighingPath"
        - "$ref": "#/components/parameters/Cursor"
        - "$ref": "#/components/parameters/PerPage"
      responses:
        "200": { description: "Jornada e ingresos.", content: { application/json: { schema: { "$ref": "#/components/schemas/DailyWeighingDetailResponse" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
  "/pesajes-diarios/{jornada}/ingresos/{ingreso}":
    delete:
      tags: ["Pesajes diarios"]
      operationId: deleteDailyWeighingEntry
      summary: "Elimina una medición concreta y devuelve la jornada actualizada"
      description: "Permiso weighings.manage. También permite jornadas cerradas, siempre con versión y motivo. Conserva la fila como histórica y registra auditoría sin borrar entradas previas. Recalcula aves, peso, promedio, anomalías y último ingreso."
      security:
        - bearerAuth: []
        - sanctumCookie: []
          csrf: []
        - bearerAuth: []
          sharedDeviceHeader: []
          sharedSessionHeader: []
        - sanctumCookie: []
          sharedDeviceCookie: []
          sharedSessionHeader: []
          csrf: []
      x-permission: weighings.manage
      parameters:
        - "$ref": "#/components/parameters/DailyWeighingPath"
        - "$ref": "#/components/parameters/DailyWeighingEntryPath"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { "$ref": "#/components/schemas/DeleteDailyWeighingEntry" } } }
      responses:
        "200": { description: "Jornada actualizada.", content: { application/json: { schema: { "$ref": "#/components/schemas/DailyWeighingOperationResponse" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/pesajes-diarios/{jornada}/distribucion":
    get:
      tags: ["Pesajes diarios"]
      operationId: getDailyWeighingDistribution
      summary: "Calcula histograma y curva con los pesos individuales activos de la jornada"
      description: "Permiso weighings.view. Excluye grupos y entradas eliminadas. Con menos de dos individuos devuelve reason=insufficient_sample; con varianza cero, reason=zero_variance. En ambos casos curve=null."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/DailyWeighingPath"
      responses:
        "200": { description: "Distribución en gramos.", content: { application/json: { schema: { "$ref": "#/components/schemas/DistributionResponse" } } } }
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
  "/pesajes":
    get:
      tags: ["Pesajes"]
      operationId: listWeighings
      summary: "Lista pesajes ordenados del más reciente al más antiguo"
      description: "Permiso requerido: weighings.view."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/FlockFilter"
        - "$ref": "#/components/parameters/ModeFilter"
        - "$ref": "#/components/parameters/From"
        - "$ref": "#/components/parameters/To"
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/PerPage"
      responses:
        "200":
          description: "Pesajes paginados."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaginatedWeighings"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
    post:
      tags: ["Pesajes"]
      operationId: recordWeighing
      summary: "Registra un pesaje individual o grupal"
      description: "Permiso requerido: weighings.manage. plan_activity_id es opcional y sólo puede identificar una actividad weighing vigente del mismo lote; el vínculo se elige explícitamente y nunca se infiere por coincidencia de tipo o fecha. La respuesta incluye origin_operation_id como referencia inequívoca a esta operación. Los valores fuera de rango requieren confirmación explícita y el primer conflicto no persiste efectos."
      security:
        - bearerAuth: []
        - sanctumCookie: []
          csrf: []
        - bearerAuth: []
          sharedDeviceHeader: []
          sharedSessionHeader: []
        - sanctumCookie: []
          sharedDeviceCookie: []
          sharedSessionHeader: []
          csrf: []
      x-permission: weighings.manage
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RecordWeighing"
      responses:
        "201":
          description: "Pesaje registrado."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/pesajes/evolucion":
    get:
      tags: ["Pesajes"]
      operationId: getWeighingEvolution
      summary: "Obtiene un punto por pesaje para la evolución de un lote"
      description: "Requiere flock_id. No agrega, interpola ni suaviza los puntos. Si la consulta supera 1000 pesajes, debes indicar date_from y date_to para acotar las fechas."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/RequiredFlockFilter"
        - "$ref": "#/components/parameters/ModeFilter"
        - "$ref": "#/components/parameters/From"
        - "$ref": "#/components/parameters/To"
        - "$ref": "#/components/parameters/OutputUnit"
      responses:
        "200":
          description: "Evolución histórica."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EvolutionResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/pesajes/{pesaje}":
    get:
      tags: ["Pesajes"]
      operationId: showWeighing
      summary: "Consulta un pesaje"
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/Weighing"
      responses:
        "200":
          description: "Pesaje."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WeighingResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
    patch:
      tags: ["Pesajes"]
      operationId: correctWeighing
      summary: "Corrige un pesaje conservando auditoría antes/después"
      security:
        - bearerAuth: []
        - sanctumCookie: []
          csrf: []
        - bearerAuth: []
          sharedDeviceHeader: []
          sharedSessionHeader: []
        - sanctumCookie: []
          sharedDeviceCookie: []
          sharedSessionHeader: []
          csrf: []
      x-permission: weighings.manage
      parameters:
        - "$ref": "#/components/parameters/Weighing"
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CorrectWeighing"
      responses:
        "200":
          description: "Pesaje corregido."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
  "/pesajes/{pesaje}/distribucion":
    get:
      tags: ["Pesajes"]
      operationId: getWeighingDistribution
      summary: "Calcula histograma y campana para un pesaje individual"
      description: "Los pesajes grupales devuelven available=false y reason=group_mode."
      x-permission: weighings.view
      parameters:
        - "$ref": "#/components/parameters/Weighing"
        - "$ref": "#/components/parameters/OutputUnit"
      responses:
        "200":
          description: "Distribución calculada."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DistributionResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
  "/configuracion-pesajes":
    get:
      tags: ["Configuración de pesajes"]
      operationId: showWeighingSettings
      summary: "Consulta la configuración global de rangos"
      x-permission: weighing-settings.manage
      responses:
        "200":
          description: "Configuración o null cuando todavía no existe."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
    put:
      tags: ["Configuración de pesajes"]
      operationId: saveWeighingSettings
      summary: "Crea o actualiza los rangos globales"
      description: "Permiso weighing-settings.manage. Actualiza y reclasifica en la misma transacción todas las jornadas abiertas de la fecha local. Cada etapa conserva el rango propio de su raza si existe y adopta el nuevo valor global si lo hereda. Las jornadas cerradas conservan su rango y resultados históricos."
      security:
        - bearerAuth: []
        - sanctumCookie: []
          csrf: []
        - bearerAuth: []
          sharedDeviceHeader: []
          sharedSessionHeader: []
        - sanctumCookie: []
          sharedDeviceCookie: []
          sharedSessionHeader: []
          csrf: []
      x-permission: weighing-settings.manage
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateSettings"
      responses:
        "200":
          description: "Configuración guardada."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationResponse"
        "401": { "$ref": "#/components/responses/Unauthenticated" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "422": { "$ref": "#/components/responses/InvalidInput" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sanctumCookie:
      type: apiKey
      in: cookie
      name: gam_session
    sharedDeviceHeader:
      type: apiKey
      in: header
      name: X-Shared-Device-Token
    sharedDeviceCookie:
      type: apiKey
      in: cookie
      name: gam_shared_device
    sharedSessionHeader:
      type: apiKey
      in: header
      name: X-GAM-Session
    csrf:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    IdempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    FlockPath:
      name: lote
      in: path
      required: true
      schema: { type: string }
    LocalDatePath:
      name: fecha
      in: path
      required: true
      schema: { type: string, format: date }
    DailyWeighingPath:
      name: jornada
      in: path
      required: true
      schema: { type: string }
    DailyWeighingEntryPath:
      name: ingreso
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Cursor opaco devuelto como next_cursor en la página anterior."
      schema: { type: string, maxLength: 2000 }
    Weighing:
      name: pesaje
      in: path
      required: true
      schema: { type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" }
    FlockFilter:
      name: flock_id
      in: query
      required: false
      schema: { type: string }
    RequiredFlockFilter:
      name: flock_id
      in: query
      required: true
      schema: { type: string }
    ModeFilter:
      name: mode
      in: query
      required: false
      schema: { type: string, enum: [individual, group] }
    From:
      name: date_from
      in: query
      required: false
      schema: { type: string, format: date }
    To:
      name: date_to
      in: query
      required: false
      schema: { type: string, format: date }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
    OutputUnit:
      name: unit
      in: query
      required: false
      schema: { type: string, enum: [g, kg], default: g }
  responses:
    Unauthenticated:
      description: "No autenticado."
      content: { application/problem+json: { schema: { "$ref": "#/components/schemas/Problem" } } }
    Forbidden:
      description: "Acceso prohibido."
      content: { application/problem+json: { schema: { "$ref": "#/components/schemas/Problem" } } }
    NotFound:
      description: "Recurso no encontrado."
      content: { application/problem+json: { schema: { "$ref": "#/components/schemas/Problem" } } }
    InvalidInput:
      description: "Datos inválidos."
      content: { application/problem+json: { schema: { "$ref": "#/components/schemas/Problem" } } }
    Conflict:
      description: "Conflicto de pesajes."
      content: { application/problem+json: { schema: { "$ref": "#/components/schemas/Problem" } } }
  schemas:
    DailyWeighingEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, mode, weight_g, bird_count, total_weight_g, average_weight_g, outside_expected_range]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time, description: "Instante almacenado en UTC." }
        mode: { type: string, enum: [individual, group] }
        weight_g: { type: [string, "null"], description: "Sólo para modalidad individual." }
        bird_count: { type: integer }
        total_weight_g: { type: string }
        average_weight_g: { type: string }
        outside_expected_range: { type: boolean }
    DailyWeighing:
      type: object
      required: [id, flock_id, date, status, expected_range, version, represented_bird_count, total_weight_g, average_weight_g, anomalous_entry_count, last_entry]
      properties:
        id: { type: string }
        flock_id: { type: string }
        date: { type: string, format: date, description: "Fecha de America/Montevideo." }
        status: { type: string, enum: [in_progress, closed] }
        expected_range:
          oneOf:
            - type: "null"
            - type: object
              required: [stage, min_weight_g, max_weight_g, unit, reference_version, source, breed_id, breed_version]
              properties:
                stage: { type: string, enum: [chick, adult] }
                min_weight_g: { type: string }
                max_weight_g: { type: string }
                unit: { type: string, enum: [g] }
                reference_version: { type: integer }
                source: { type: string, enum: [global, breed], description: "Origen del rango capturado para esta etapa." }
                breed_id: { type: [integer, "null"], description: "Raza del lote al capturar la referencia; null en jornadas previas a esta ampliación." }
                breed_version: { type: [integer, "null"] }
        version: { type: integer }
        represented_bird_count: { type: integer }
        total_weight_g: { type: string }
        average_weight_g: { type: [string, "null"], description: "Suma de pesos individuales y totales grupales dividida entre todas las aves pesadas." }
        anomalous_entry_count: { type: integer, description: "Cuenta ingresos, no aves; un grupo fuera de rango suma uno." }
        last_entry:
          oneOf:
            - type: "null"
            - "$ref": "#/components/schemas/DailyWeighingEntry"
    DailyWeighingPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: { type: array, items: { "$ref": "#/components/schemas/DailyWeighing" } }
        next_cursor: { type: [string, "null"] }
    DailyWeighingDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - "$ref": "#/components/schemas/DailyWeighing"
            - type: object
              required: [entries, next_cursor]
              properties:
                entries: { type: array, items: { "$ref": "#/components/schemas/DailyWeighingEntry" } }
                next_cursor: { type: [string, "null"] }
    AddDailyWeighingEntry:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, weight]
          properties:
            mode: { type: string, enum: [individual] }
            weight: { "$ref": "#/components/schemas/DecimalGrams" }
            confirm_out_of_range: { type: boolean, default: false }
        - type: object
          additionalProperties: false
          required: [mode, bird_count, total_weight]
          properties:
            mode: { type: string, enum: [group] }
            bird_count: { type: integer, minimum: 1 }
            total_weight: { "$ref": "#/components/schemas/DecimalGrams" }
            confirm_out_of_range: { type: boolean, default: false }
    DeleteDailyWeighingEntry:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    DailyWeighingOperationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [operation_id, daily_weighing]
          properties:
            operation_id: { type: string, format: uuid }
            daily_weighing: { "$ref": "#/components/schemas/DailyWeighing" }
            entry: { "$ref": "#/components/schemas/DailyWeighingEntry" }
            deleted_entry_id: { type: string }
    DecimalGrams:
      type: string
      pattern: "^(?=.*[1-9])(?:0|[1-9][0-9]{0,12})(?:\\.[0-9])?$"
      description: "Gramos positivos: hasta 13 dígitos enteros y un decimal."
    DecimalKilograms:
      type: string
      pattern: "^(?=.*[1-9])(?:0|[1-9][0-9]{0,9})(?:\\.[0-9]{1,4})?$"
      description: "Kilogramos positivos: hasta 10 dígitos enteros y cuatro decimales."
    RecordWeighing:
      oneOf:
        - "$ref": "#/components/schemas/RecordWeighingGrams"
        - "$ref": "#/components/schemas/RecordWeighingKilograms"
      discriminator:
        propertyName: unit
        mapping:
          g: "#/components/schemas/RecordWeighingGrams"
          kg: "#/components/schemas/RecordWeighingKilograms"
    RecordWeighingGrams:
      type: object
      additionalProperties: false
      required: [flock_id, mode, unit, measurements]
      properties:
        id: { type: string }
        flock_id: { type: string }
        mode: { type: string, enum: [individual, group] }
        unit: { type: string, enum: [g] }
        occurred_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 5000 }
        plan_activity_id:
          type: [string, "null"]
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
          description: "Actividad weighing vigente del mismo lote, cuando se asocia explícitamente; null registra el pesaje fuera de plan."
        confirm_out_of_range: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - "$ref": "#/components/schemas/IndividualMeasurementGrams"
              - "$ref": "#/components/schemas/GroupMeasurementGrams"
    RecordWeighingKilograms:
      type: object
      additionalProperties: false
      required: [flock_id, mode, unit, measurements]
      properties:
        id: { type: string }
        flock_id: { type: string }
        mode: { type: string, enum: [individual, group] }
        unit: { type: string, enum: [kg] }
        occurred_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 5000 }
        plan_activity_id:
          type: [string, "null"]
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
          description: "Actividad weighing vigente del mismo lote, cuando se asocia explícitamente; null registra el pesaje fuera de plan."
        confirm_out_of_range: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - "$ref": "#/components/schemas/IndividualMeasurementKilograms"
              - "$ref": "#/components/schemas/GroupMeasurementKilograms"
    IndividualMeasurementGrams:
      type: object
      additionalProperties: false
      required: [weight]
      properties:
        weight: { "$ref": "#/components/schemas/DecimalGrams" }
    GroupMeasurementGrams:
      type: object
      additionalProperties: false
      required: [total_weight, bird_count]
      properties:
        total_weight: { "$ref": "#/components/schemas/DecimalGrams" }
        bird_count: { type: integer, minimum: 1 }
    IndividualMeasurementKilograms:
      type: object
      additionalProperties: false
      required: [weight]
      properties:
        weight: { "$ref": "#/components/schemas/DecimalKilograms" }
    GroupMeasurementKilograms:
      type: object
      additionalProperties: false
      required: [total_weight, bird_count]
      properties:
        total_weight: { "$ref": "#/components/schemas/DecimalKilograms" }
        bird_count: { type: integer, minimum: 1 }
    CorrectWeighing:
      oneOf:
        - "$ref": "#/components/schemas/CorrectWeighingGrams"
        - "$ref": "#/components/schemas/CorrectWeighingKilograms"
        - "$ref": "#/components/schemas/CorrectWeighingInheritedUnit"
      description: "Con unit explícita, las mediciones deben usar el formato de esa unidad. Si unit se omite, el servidor conserva la unidad capturada del pesaje y valida las mediciones con esa unidad; como el contrato no conoce ese valor histórico, la variante heredada acepta el formato de gramos o kilogramos."
    CorrectWeighingGrams:
      type: object
      additionalProperties: false
      required: [version, correction_reason, unit]
      properties:
        version: { type: integer, minimum: 1 }
        correction_reason: { type: string, minLength: 1, maxLength: 500 }
        flock_id: { type: string }
        mode: { type: string, enum: [individual, group] }
        unit: { type: string, enum: [g] }
        occurred_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 5000 }
        confirm_out_of_range: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - "$ref": "#/components/schemas/IndividualMeasurementGrams"
              - "$ref": "#/components/schemas/GroupMeasurementGrams"
    CorrectWeighingKilograms:
      type: object
      additionalProperties: false
      required: [version, correction_reason, unit]
      properties:
        version: { type: integer, minimum: 1 }
        correction_reason: { type: string, minLength: 1, maxLength: 500 }
        flock_id: { type: string }
        mode: { type: string, enum: [individual, group] }
        unit: { type: string, enum: [kg] }
        occurred_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 5000 }
        confirm_out_of_range: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            oneOf:
              - "$ref": "#/components/schemas/IndividualMeasurementKilograms"
              - "$ref": "#/components/schemas/GroupMeasurementKilograms"
    CorrectWeighingInheritedUnit:
      type: object
      additionalProperties: false
      required: [version, correction_reason]
      description: "No incluye unit: el servidor hereda la unidad capturada del pesaje. Las mediciones se muestran con cualquier formato decimal compatible porque la unidad efectiva sólo se conoce al resolver el pesaje; después de heredarla, el servidor aplica exclusivamente la validación de gramos o kilogramos correspondiente."
      properties:
        version: { type: integer, minimum: 1 }
        correction_reason: { type: string, minLength: 1, maxLength: 500 }
        flock_id: { type: string }
        mode: { type: string, enum: [individual, group] }
        occurred_at: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 5000 }
        confirm_out_of_range: { type: boolean }
        measurements:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            anyOf:
              - "$ref": "#/components/schemas/IndividualMeasurementGrams"
              - "$ref": "#/components/schemas/GroupMeasurementGrams"
              - "$ref": "#/components/schemas/IndividualMeasurementKilograms"
              - "$ref": "#/components/schemas/GroupMeasurementKilograms"
    UpdateSettings:
      oneOf:
        - "$ref": "#/components/schemas/UpdateSettingsGrams"
        - "$ref": "#/components/schemas/UpdateSettingsKilograms"
      discriminator:
        propertyName: unit
        mapping:
          g: "#/components/schemas/UpdateSettingsGrams"
          kg: "#/components/schemas/UpdateSettingsKilograms"
    UpdateSettingsGrams:
      type: object
      additionalProperties: false
      required: [adult_from_week, unit, chick_min_weight, chick_max_weight, adult_min_weight, adult_max_weight]
      properties:
        version: { type: integer, minimum: 1 }
        adult_from_week: { type: integer, minimum: 1 }
        unit: { type: string, enum: [g] }
        chick_min_weight: { "$ref": "#/components/schemas/DecimalGrams" }
        chick_max_weight: { "$ref": "#/components/schemas/DecimalGrams" }
        adult_min_weight: { "$ref": "#/components/schemas/DecimalGrams" }
        adult_max_weight: { "$ref": "#/components/schemas/DecimalGrams" }
    UpdateSettingsKilograms:
      type: object
      additionalProperties: false
      required: [adult_from_week, unit, chick_min_weight, chick_max_weight, adult_min_weight, adult_max_weight]
      properties:
        version: { type: integer, minimum: 1 }
        adult_from_week: { type: integer, minimum: 1 }
        unit: { type: string, enum: [kg] }
        chick_min_weight: { "$ref": "#/components/schemas/DecimalKilograms" }
        chick_max_weight: { "$ref": "#/components/schemas/DecimalKilograms" }
        adult_min_weight: { "$ref": "#/components/schemas/DecimalKilograms" }
        adult_max_weight: { "$ref": "#/components/schemas/DecimalKilograms" }
    Measurement:
      type: object
      additionalProperties: false
      required: [position, weight_g, total_weight_g, bird_count, average_weight_g, outside_expected_range]
      properties:
        position: { type: integer }
        weight_g: { type: [string, "null"] }
        total_weight_g: { type: [string, "null"] }
        bird_count: { type: [integer, "null"] }
        average_weight_g: { type: [string, "null"] }
        outside_expected_range: { type: boolean }
    Weighing:
      type: object
      additionalProperties: false
      required: [id, flock_id, plan_activity_id, origin_operation_id, poultry_house_id, production_unit_id, mode, occurred_at, unit, captured_unit, notes, stage, expected_range, reference, represented_bird_count, total_weight_g, average_weight_g, total_weight, average_weight, outside_expected_range, version, created_by, measurements]
      properties:
        id: { type: string }
        flock_id: { type: string }
        plan_activity_id:
          type: [string, "null"]
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
          description: "Actividad weighing vigente asociada explícitamente; null identifica un pesaje fuera de plan."
        origin_operation_id:
          type: [string, "null"]
          format: uuid
          description: "Identificador inequívoco de la operación que registró este pesaje."
        poultry_house_id: { type: integer }
        production_unit_id: { type: integer }
        mode: { type: string, enum: [individual, group] }
        occurred_at: { type: string, format: date-time }
        unit: { type: string, enum: [g, kg] }
        captured_unit: { type: string, enum: [g, kg] }
        notes: { type: [string, "null"] }
        stage: { type: [string, "null"], enum: [chick, adult, "null"] }
        expected_range:
          type: [object, "null"]
          description: "Rango capturado, inmutable ante cambios posteriores; source indica global o breed."
          properties:
            min_weight_g: { type: string }
            max_weight_g: { type: string }
            unit: { type: string, enum: [g] }
            source: { type: string, enum: [global, breed] }
        reference:
          type: [object, "null"]
          description: "Snapshot de los cuatro límites efectivos usados, semana de cambio de etapa y procedencia. Se preserva al corregir un pesaje."
          properties:
            version: { type: integer, description: "Versión global capturada." }
            adult_from_week: { type: integer }
            chick_min_weight_g: { type: string }
            chick_max_weight_g: { type: string }
            adult_min_weight_g: { type: string }
            adult_max_weight_g: { type: string }
            chick_source: { type: string, enum: [global, breed] }
            adult_source: { type: string, enum: [global, breed] }
            breed_id: { type: [integer, "null"] }
            breed_version: { type: [integer, "null"] }
        represented_bird_count: { type: integer }
        total_weight_g: { type: string }
        average_weight_g: { type: string }
        total_weight: { type: object }
        average_weight: { type: object }
        outside_expected_range: { type: boolean }
        version: { type: integer }
        created_by: { type: [integer, "null"] }
        measurements:
          type: array
          items: { "$ref": "#/components/schemas/Measurement" }
    ReferenceSettings:
      type: object
      additionalProperties: false
      required: [adult_from_week, chick_min_weight_g, chick_max_weight_g, adult_min_weight_g, adult_max_weight_g, unit, captured_unit, version]
      properties:
        adult_from_week: { type: integer }
        chick_min_weight_g: { type: string }
        chick_max_weight_g: { type: string }
        adult_min_weight_g: { type: string }
        adult_max_weight_g: { type: string }
        unit: { type: string, enum: [g, kg] }
        captured_unit: { type: string, enum: [g, kg] }
        version: { type: integer }
    Operation:
      type: object
      additionalProperties: true
      required: [operation_id]
      properties:
        operation_id: { type: string, format: uuid }
        warnings:
          type: array
          items: { "$ref": "#/components/schemas/Warning" }
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, enum: [WEIGHING_REFERENCE_UNAVAILABLE] }
        message: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        message: { type: string }
        meta: { type: object }
    PaginatedWeighings:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array, items: { "$ref": "#/components/schemas/Weighing" } }
        links: { type: object }
        meta: { type: object }
    WeighingResponse:
      type: object
      required: [data]
      properties: { data: { "$ref": "#/components/schemas/Weighing" } }
    SettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - "$ref": "#/components/schemas/ReferenceSettings"
            - type: "null"
    OperationResponse:
      type: object
      required: [data]
      properties: { data: { "$ref": "#/components/schemas/Operation" } }
    EvolutionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { "$ref": "#/components/schemas/EvolutionPoint" }
    EvolutionPoint:
      type: object
      required: [id, date, mode, represented_bird_count, average_weight, average_weight_g, unit, outside_expected_range]
      properties:
        id: { type: string }
        date: { type: string, format: date-time }
        mode: { type: string }
        represented_bird_count: { type: integer }
        average_weight: { type: object }
        average_weight_g: { type: string }
        unit: { type: string }
        outside_expected_range: { type: boolean }
    DistributionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: "mean, sample_stddev y los límites de bins y curve.x usan unit. curve.y es densidad en esa unidad y cada punto declara y_unit como 1/g o 1/kg."
          required: [available, reason, unit, n, mean, sample_stddev, bins, curve]
          properties:
            available: { type: boolean }
            reason: { type: [string, "null"] }
            unit: { type: string }
            n: { type: [integer, "null"] }
            mean: { type: [string, "null"] }
            sample_stddev: { type: [string, "null"] }
            bins: { type: array }
            curve:
              type: [array, "null"]
              items:
                type: object
                additionalProperties: false
                required: [x, y, y_unit]
                properties:
                  x: { type: string }
                  y: { type: string }
                  y_unit: { type: string, enum: ["1/g", "1/kg"] }
