openapi: 3.1.0
info:
  title: Notificaciones de GAM
  version: 1.0.0
  description: Bandeja personal de notificaciones y configuración de alertas operativas.
servers:
  - url: /
security:
  - sesionWeb: []
  - tokenPersonal: []
paths:
  /alertas-operativas:
    get:
      operationId: listOperationalAlerts
      summary: Lista alertas operativas abiertas visibles para la sesión
      description: Requiere can_view_notifications y el permiso del módulo emisor por alerta. Para saldo negativo de reparto se acepta can_view_delivery_history o can_monitor_deliveries. Un episodio se cuenta una sola vez aunque se haya notificado a varios destinatarios.
      parameters:
        - {$ref: '#/components/parameters/FiltroUpAlertas'}
        - {$ref: '#/components/parameters/FiltroUrgenciaAlertas'}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Alertas ordenadas desde la más reciente
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AlertaOperativa'}
                  links: {type: object, additionalProperties: true}
                  meta: {type: object, additionalProperties: true}
        '401': {description: Se requiere autenticación}
        '403': {description: Permiso insuficiente}
        '404': {description: Unidad fuera del alcance de la sesión PIN}
        '422': {description: Filtros inválidos}
  /alertas-operativas/resumen:
    get:
      operationId: summarizeOperationalAlerts
      summary: Cuenta las alertas operativas abiertas por urgencia
      description: Aplica el mismo alcance y permisos que el listado. El filtro de urgencia conserva las tres claves y devuelve cero para las demás urgencias.
      parameters:
        - {$ref: '#/components/parameters/FiltroUpAlertas'}
        - {$ref: '#/components/parameters/FiltroUrgenciaAlertas'}
      responses:
        '200':
          description: Conteos anteriores a la paginación
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [up_id, consultado_en, total, por_urgencia]
                    properties:
                      up_id: {type: [integer, 'null'], minimum: 1}
                      consultado_en: {type: string, format: date-time}
                      total: {type: integer, minimum: 0}
                      por_urgencia:
                        type: object
                        required: [alto, medio, bajo]
                        properties:
                          alto: {type: integer, minimum: 0}
                          medio: {type: integer, minimum: 0}
                          bajo: {type: integer, minimum: 0}
        '401': {description: Se requiere autenticación}
        '403': {description: Permiso insuficiente}
        '404': {description: Unidad fuera del alcance de la sesión PIN}
        '422': {description: Filtros inválidos}
  /api/v1/notificaciones:
    get:
      summary: Lista las notificaciones propias de más reciente a más antigua
      parameters:
        - name: estado_lectura
          in: query
          schema: {type: string, enum: [leida, no_leida]}
        - name: estado_resolucion
          in: query
          description: Vigente incluye notificaciones informativas y alertas pendientes. Resuelto incluye alertas cerradas. Al omitirlo se incluyen todos los avisos.
          schema: {type: string, enum: [vigente, resuelto]}
        - name: urgencia
          in: query
          schema: {$ref: '#/components/schemas/Urgencia'}
        - name: modulo
          in: query
          description: Código estable del módulo que emitió el aviso
          schema: {$ref: '#/components/schemas/Modulo'}
        - name: orden
          in: query
          description: Por fecha descendente o por urgencia de alto a bajo. En cada nivel se muestran primero los avisos más recientes.
          schema: {type: string, enum: [fecha, urgencia], default: fecha}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100000}
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Página de notificaciones
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Notificacion'}
                  meta: {type: object}
                  links: {type: object}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de notificaciones}
        '422': {description: Filtros inválidos}
  /api/v1/notificaciones/resumen:
    get:
      summary: Consulta el contador y la suscripción privada de la sesión
      responses:
        '200':
          description: Resumen de la bandeja
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [no_leidas, tiempo_real]
                    properties:
                      no_leidas: {type: integer, minimum: 0}
                      tiempo_real:
                        type: [object, 'null']
                        required: [clave, canal]
                        properties:
                          clave: {type: string, description: Clave pública de Reverb}
                          canal: {type: string, description: Canal privado de la sesión sin el prefijo del protocolo}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de notificaciones}
  /api/v1/notificaciones/canal:
    post:
      summary: Autoriza la suscripción de la sesión vigente al canal privado
      description: El evento notifications.changed indica que debe volver a consultarse la bandeja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: {type: string, example: '123.456'}
                channel_name: {type: string, description: Canal de la sesión con prefijo private-}
      responses:
        '200':
          description: Firma de autorización para Reverb
          content:
            application/json:
              schema:
                type: object
                required: [auth]
                properties:
                  auth: {type: string}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Canal ajeno o suscripción no autorizada}
        '422': {description: Datos del canal inválidos}
        '429': {description: Demasiadas solicitudes}
  /api/v1/notificaciones/{notificacion}:
    parameters:
      - $ref: '#/components/parameters/Notificacion'
    get:
      summary: Consulta una notificación propia
      responses:
        '200': {$ref: '#/components/responses/Notificacion'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de notificaciones}
        '404': {description: Notificación no disponible}
  /api/v1/notificaciones/{notificacion}/lectura:
    parameters:
      - $ref: '#/components/parameters/Notificacion'
    patch:
      summary: Marca como leída y conserva la primera fecha de lectura
      responses:
        '200': {$ref: '#/components/responses/Notificacion'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de notificaciones}
        '404': {description: Notificación no disponible}
  /api/v1/unidades-productivas/{productionUnit}/umbrales-alertas/{alertType}:
    parameters:
      - name: productionUnit
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - name: alertType
        in: path
        required: true
        schema: {$ref: '#/components/schemas/TipoUmbralTemporal'}
    get:
      summary: Consulta los umbrales efectivos por unidad productiva y tipo de alerta
      description: Requiere can_manage_alert_thresholds. Las cuentas PIN consultan su propia unidad productiva.
      responses:
        '200': {$ref: '#/components/responses/UmbralesTemporales'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de configuración de umbrales}
        '404': {description: Unidad productiva o tipo de alerta no disponible}
    put:
      summary: Configura los días de cada nivel por unidad productiva y tipo de alerta
      description: Requiere can_manage_alert_thresholds. Los cambios se aplican en la próxima evaluación.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UmbralesTemporalesInput'}
            examples:
              recoleccion_diaria:
                value: {bajo: 1, medio: 2, alto: 7}
              vacuna:
                value: {bajo: null, medio: -7, alto: 0}
      responses:
        '200': {$ref: '#/components/responses/UmbralesTemporales'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de configuración de umbrales}
        '404': {description: Unidad productiva o tipo de alerta no disponible}
        '422': {description: Umbrales inválidos}
  /api/v1/configuracion-alertas:
    get:
      summary: Lista la configuración de alertas de alcance general
      description: Requiere can_manage_alert_thresholds y una sesión personal. Incluye Vehículos, ubicaciones generales de Inventario y repartos de alcance general.
      responses:
        '200': {$ref: '#/components/responses/CatalogoAlertas'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Permiso o alcance general insuficiente}
  /api/v1/configuracion-alertas/{operationalAlertType}:
    parameters:
      - $ref: '#/components/parameters/TipoAlertaOperativa'
    patch:
      summary: Actualiza los campos enviados de una alerta general
      description: Requiere can_manage_alert_thresholds y una sesión personal. Cada alerta admite sólo las claves anunciadas en campos.
      requestBody:
        $ref: '#/components/requestBodies/CambioConfiguracionAlerta'
      responses:
        '200': {$ref: '#/components/responses/ConfiguracionAlerta'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Permiso o alcance general insuficiente}
        '404': {description: Tipo de alerta no disponible en el ámbito general}
        '422': {description: Campos desconocidos o valores inválidos}
  /api/v1/unidades-productivas/{productionUnit}/configuracion-alertas:
    parameters:
      - $ref: '#/components/parameters/UnidadProductivaAlertas'
    get:
      summary: Lista la configuración de alertas de una unidad productiva
      description: Requiere can_manage_alert_thresholds. Una cuenta PIN puede consultar su propia unidad productiva.
      responses:
        '200': {$ref: '#/components/responses/CatalogoAlertas'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de configuración de alertas}
        '404': {description: Unidad productiva no disponible}
  /api/v1/unidades-productivas/{productionUnit}/configuracion-alertas/{operationalAlertType}:
    parameters:
      - $ref: '#/components/parameters/UnidadProductivaAlertas'
      - $ref: '#/components/parameters/TipoAlertaOperativa'
    patch:
      summary: Actualiza los campos enviados de una alerta de la unidad productiva
      description: Requiere can_manage_alert_thresholds. Cada alerta admite sólo las claves anunciadas en campos.
      requestBody:
        $ref: '#/components/requestBodies/CambioConfiguracionAlerta'
      responses:
        '200': {$ref: '#/components/responses/ConfiguracionAlerta'}
        '401': {description: Sesión ausente o inválida}
        '403': {description: Falta el permiso de configuración de alertas}
        '404': {description: Unidad productiva o tipo de alerta no disponible en ese ámbito}
        '422': {description: Campos desconocidos o valores inválidos}
components:
  securitySchemes:
    sesionWeb: {type: apiKey, in: cookie, name: gam_session, description: Sesión web de Sanctum con CSRF en escrituras}
    tokenPersonal: {type: http, scheme: bearer, description: En equipos compartidos también se requiere la credencial de equipo y X-GAM-Session}
  parameters:
    FiltroUpAlertas:
      name: up_id
      in: query
      description: Al omitirlo, la sesión PIN consulta su UP y la sesión personal consulta la empresa, incluidas las alertas generales autorizadas.
      schema: {type: integer, minimum: 1}
    FiltroUrgenciaAlertas:
      name: urgencia
      in: query
      schema: {type: string, enum: [alto, medio, bajo]}
    UnidadProductivaAlertas:
      name: productionUnit
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    TipoAlertaOperativa:
      name: operationalAlertType
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TipoAlertaOperativa'}
    Notificacion:
      name: notificacion
      in: path
      required: true
      schema: {type: string, format: ulid}
  requestBodies:
    CambioConfiguracionAlerta:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CambioConfiguracionAlerta'}
          examples:
            ampliar_anticipacion:
              value: {dias_anticipacion: 14}
            restablecer_urgencia_calculada:
              value: {urgencia_fija: null}
  responses:
    CatalogoAlertas:
      description: Configuraciones efectivas y campos disponibles en el ámbito solicitado
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/ConfiguracionAlerta'}
    ConfiguracionAlerta:
      description: Configuración efectiva después de aplicar el cambio
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/ConfiguracionAlerta'}
    UmbralesTemporales:
      description: Configuración efectiva de umbrales
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [unidad_productiva_id, tipo, bajo, medio, alto]
                properties:
                  unidad_productiva_id: {type: integer}
                  tipo: {$ref: '#/components/schemas/TipoUmbralTemporal'}
                  bajo: {type: [integer, 'null']}
                  medio: {type: [integer, 'null']}
                  alto: {type: integer}
    Notificacion:
      description: Notificación personal
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Notificacion'}
  schemas:
    AlertaOperativa:
      type: object
      required: [id, tipo, modulo, up_id, urgencia, titulo, ocurrida_en, entidad]
      properties:
        id: {type: string, format: ulid}
        tipo: {$ref: '#/components/schemas/TipoAlertaOperativa'}
        modulo: {type: string}
        up_id: {type: [integer, 'null'], minimum: 1}
        urgencia: {type: string, enum: [alto, medio, bajo]}
        titulo: {type: string}
        ocurrida_en: {type: string, format: date-time}
        entidad:
          type: object
          required: [tipo, id, ruta]
          properties:
            tipo: {type: string}
            id: {type: string}
            ruta: {type: [string, 'null']}
    TipoAlertaOperativa:
      type: string
      enum:
        - daily_egg_collection_missing
        - manual_feeding_review_due
        - vaccination_due
        - medication_due
        - beak_trimming_due
        - manual_practice_due
        - flock_movement_due
        - egg_collection_due
        - mortality_due
        - feed_coverage
        - poultry_house_over_capacity
        - stock_minimum_reached
        - egg_stock_negative
        - weighing_anomaly
        - delivery_egg_surplus
        - delivery_egg_balance_negative
        - vehicle_maintenance_due
        - vehicle_maintenance_plan_due
        - vehicle_document_expiring
    CambioConfiguracionAlerta:
      type: object
      additionalProperties: false
      properties:
        habilitada: {type: boolean}
        urgencia_fija:
          description: Con null se usa la urgencia calculada por la regla operativa.
          oneOf:
            - $ref: '#/components/schemas/Urgencia'
            - type: 'null'
        dias_anticipacion: {type: integer, minimum: 0, maximum: 365}
        kilometros_anticipacion: {type: integer, minimum: 0, maximum: 1000000}
        exceso_minimo_aves: {type: integer, minimum: 1, maximum: 2147483647}
        deficit_minimo_huevos: {type: integer, minimum: 1, maximum: 2147483647}
        sobrante_minimo_huevos: {type: integer, minimum: 1, maximum: 2147483647}
    CampoConfiguracionAlerta:
      type: object
      required: [clave, etiqueta, tipo, predeterminado]
      properties:
        clave: {type: string, example: dias_anticipacion}
        etiqueta: {type: string}
        tipo: {type: string, enum: [booleano, seleccion, entero]}
        predeterminado: {type: [boolean, integer, string, 'null']}
        opciones:
          type: array
          items: {enum: [null, bajo, medio, alto]}
        minimo: {type: integer}
        maximo: {type: integer}
    ConfiguracionAlerta:
      type: object
      required: [tipo, nombre, modulo, unidad_productiva_id, ruta, configuracion, campos, criterio_relacionado]
      properties:
        tipo: {$ref: '#/components/schemas/TipoAlertaOperativa'}
        nombre: {type: string}
        modulo: {$ref: '#/components/schemas/Modulo'}
        unidad_productiva_id: {type: [integer, 'null'], description: Null identifica el ámbito general}
        ruta: {type: string, description: Ruta PATCH que acepta las claves anunciadas en campos}
        configuracion:
          allOf:
            - $ref: '#/components/schemas/CambioConfiguracionAlerta'
            - required: [habilitada, urgencia_fija]
        campos:
          type: array
          items: {$ref: '#/components/schemas/CampoConfiguracionAlerta'}
        criterio_relacionado:
          type: [object, 'null']
          description: Parámetros administrados por su API original. Si dependen de una entidad, la ruta incluye su parámetro y los valores son null.
          required: [nombre, ruta, metodo, valores]
          properties:
            nombre: {type: string}
            ruta: {type: string}
            metodo: {type: string, enum: [PUT, PATCH]}
            valores:
              type: [object, 'null']
              additionalProperties: {type: [integer, 'null']}
    TipoUmbralTemporal:
      type: string
      enum: [daily_egg_collection_missing, manual_feeding_review_due, vaccination_due, medication_due, beak_trimming_due, manual_practice_due, flock_movement_due, egg_collection_due, mortality_due]
    UmbralesTemporalesInput:
      type: object
      additionalProperties: false
      required: [bajo, medio, alto]
      description: Los niveles activos deben estar en orden ascendente. Nulo deshabilita bajo o medio. En recolección de huevos se admiten 1 a 365 jornadas locales cerradas sin registro vigente. En revisión de ración manual, bajo debe ser nulo y medio y alto deben estar entre 1 y 365. Para tareas previstas, los valores negativos anticipan el aviso, cero es el día previsto y los positivos indican días de atraso.
      properties:
        bajo: {type: [integer, 'null'], minimum: -365, maximum: 365}
        medio: {type: [integer, 'null'], minimum: -365, maximum: 365}
        alto: {type: integer, minimum: -365, maximum: 365}
    Urgencia:
      type: string
      enum: [bajo, medio, alto]
    Modulo:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,79}$'
      maxLength: 80
      example: management_plans
    Notificacion:
      type: object
      required: [id, tipo, urgencia, modulo, titulo, mensaje, fecha, leida_en, estado_resolucion, resuelta_en, entidad]
      properties:
        id: {type: string, format: ulid}
        tipo:
          type: string
          description: >-
            Código estable del aviso emitido por el módulo. Lotes publica daily_egg_collection_missing y weighing_anomaly.
            Las anomalías de pesaje tienen urgencia alta y referencian un ingreso diario o un pesaje independiente.
            Planes de manejo publica feed_coverage, manual_feeding_review_due, vaccination_due, medication_due,
            beak_trimming_due, manual_practice_due, flock_movement_due, egg_collection_due y mortality_due.
            Instalaciones publica poultry_house_over_capacity con una referencia al galpón, urgencia media durante los
            siete días previos a la adultez y alta desde la adultez si la ocupación supera la capacidad.
            El aviso se resuelve al llegar a la capacidad máxima o quedar por debajo.
            Inventario publica stock_minimum_reached con una referencia al saldo por ubicación, urgencia media al
            igualar el mínimo y alta por debajo del mínimo. El aviso se resuelve cuando el saldo supera el mínimo.
            Inventario publica egg_stock_negative con urgencia alta mientras el saldo de huevos de la UP sea
            negativo. Los avisos históricos delivery_egg_stock_negative quedan resueltos al reevaluar la UP.
            Repartos publica delivery_egg_balance_negative con urgencia alta si las entregas superan la carga.
            Al regularizar el saldo, resuelve la alerta. El aviso informativo delivery_egg_surplus se publica
            con urgencia baja al ingresar el sobrante en la UP de destino.
            Vehículos publica vehicle_maintenance_due con urgencia baja desde tres días antes y alta a partir del
            día posterior a la fecha prevista si la intervención sigue pendiente. Completarla o anularla resuelve el aviso.
            vehicle_maintenance_plan_due avisa a 30 días o 500 km del límite y sube a alta al alcanzarlo.
            vehicle_document_expiring avisa a 30 días del vencimiento, sube a alta al día siguiente y se resuelve
            para el documento anterior al cargar una renovación del mismo tipo y título.
          example: medication_due
        urgencia: {$ref: '#/components/schemas/Urgencia'}
        modulo: {$ref: '#/components/schemas/Modulo'}
        titulo: {type: string}
        mensaje: {type: string}
        fecha: {type: string, format: date-time}
        leida_en: {type: [string, 'null'], format: date-time}
        estado_resolucion:
          type: [string, 'null']
          enum: [no_resuelto, resuelto, null]
          description: Estado operativo del aviso de alerta. Las notificaciones informativas tienen valor nulo.
        resuelta_en:
          type: [string, 'null']
          format: date-time
          description: Fecha de la primera resolución del aviso de alerta.
        entidad:
          type: [object, 'null']
          required: [tipo, id, ruta]
          properties:
            tipo: {type: string}
            id: {type: string}
            ruta: {type: [string, 'null']}
