openapi: "3.1.0"
info:
  title: "09 — Producción y stock de huevos"
  version: "2.0.0"
  description: "Contrato de Lotes y producción de huevos para web y mobile. La recolección de huevo genérico ingresa atómicamente a una cuenta corriente por unidad productiva; las correcciones son compensaciones auditadas. No hay borrado ni interfaz mobile en esta entrega. Los valores de status, eventos, tipos y permisos son identificadores estables en inglés."
  license:
    name: "Proprietary"
    identifier: "Proprietary"
servers:
  -
    url: "/api/v1"
security:
  -
    bearerAuth: []
tags:
  -
    name: "Lotes"
    description: "Ciclo de vida, cantidades, ubicación y edad desde el ingreso."
  -
    name: "Redistribuciones"
    description: "Traslados parciales, totales e histórico compensatorio."
  -
    name: "Catálogos"
    description: "Razas y categorías de mortalidad con vigencia."
  -
    name: "Mortalidad"
    description: "Bajas y correcciones auditadas."
  -
    name: "Recolección"
    description: "Producción histórica de huevo genérico y métricas."
  -
    name: "Stock de huevos"
    description: "Cuenta corriente por unidad productiva, movimientos y correcciones."
paths:
  "/flocks":
    get:
      tags: ["Lotes"]
      operationId: "listFlocks"
      summary: "Lista y busca lotes de toda la empresa"
      description: "Permiso requerido: flocks.view. El acceso es global dentro de la empresa."
      x-permission: "flocks.view"
      parameters:
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/PerPage"
        -
          "$ref": "#/components/parameters/From"
        -
          "$ref": "#/components/parameters/To"
        -
          "$ref": "#/components/parameters/Search"
        -
          "$ref": "#/components/parameters/HouseFilter"
        -
          "$ref": "#/components/parameters/UnitFilter"
        -
          "$ref": "#/components/parameters/BreedFilter"
        -
          "$ref": "#/components/parameters/SupplierFilter"
        -
          "$ref": "#/components/parameters/FlockStatus"
      responses:
        "200":
          description: "Consulta u operación completada."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaginatedFlocks"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/InvalidInput"
    post:
      tags: ["Lotes"]
      operationId: "createFlock"
      summary: "Registra una admisión de aves"
      description: "Permiso requerido: flocks.manage. La auditoría y todos los efectos se confirman juntos; el reintento idéntico devuelve la respuesta original."
      x-permission: "flocks.manage"
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateFlock"
      responses:
        "201":
          description: "Operación registrada o resultado original recuperado por idempotencia."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OperationResponse"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
