        "422": {"$ref": "#/components/responses/InvalidInput"}
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Sanctum"
  parameters:
    Flock:
      name: "flock"
      in: "path"
      required: true
      description: "ULID público del lote, incluidos los finalizados."
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    Redistribution:
      name: "redistribution"
      in: "path"
      required: true
      description: "ULID público del movimiento original de redistribución."
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    Mortality:
      name: "mortality"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    EggCollection:
      name: "collection"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    ProductionUnit:
      name: "productionUnit"
      in: "path"
      required: true
      description: "Identificador numérico de la unidad productiva."
      schema:
        type: "integer"
        minimum: 1
    StockMovement:
      name: "movement"
      in: "path"
      required: true
      description: "ULID público del movimiento lógico de huevos."
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    PoultryHouse:
      name: "poultryHouse"
      in: "path"
      required: true
      schema:
        type: "integer"
        minimum: 1
    Breed:
      name: "breed"
      in: "path"
      required: true
      schema:
        type: "integer"
        minimum: 1
    MortalityCategory:
      name: "mortalityCategory"
      in: "path"
      required: true
      schema:
        type: "integer"
        minimum: 1
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "UUID por operación y actor. Conservar el mismo contenido y clave al reintentar; otra intención requiere otra clave."
      schema:
        type: "string"
        format: "uuid"
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100000
        default: 1
    PerPage:
      name: "per_page"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    From:
      name: "date_from"
      in: "query"
      description: "Día inclusivo en la zona LOTS_TIMEZONE; en listado de lotes filtra fecha de ingreso."
      schema:
        type: "string"
        format: "date"
    To:
      name: "date_to"
      in: "query"
      description: "Día inclusivo y no anterior a date_from."
      schema:
        type: "string"
        format: "date"
    Search:
      name: "search"
      in: "query"
      schema:
        type: "string"
        maxLength: 120
    HouseFilter:
      name: "poultry_house_id"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
    UnitFilter:
      name: "production_unit_id"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
    BreedFilter:
      name: "breed_id"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
    SupplierFilter:
      name: "supplier_id"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
    FlockFilter:
      name: "flock_id"
      in: "query"
      schema:
        type: "string"
        pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        example: "01J00000000000000000000000"
    FlockStatus:
      name: "status"
      in: "query"
      schema:
        type: "string"
        enum: ["active", "quarantined", "finished"]
    RecordStatus:
      name: "status"
      in: "query"
      schema:
        type: "string"
        enum: ["recorded", "cancelled"]
    StockType:
      name: "type"
      in: "query"
      schema:
        type: "string"
        enum: ["collection_receipt", "manual_receipt", "distribution_preparation", "loss"]
    CatalogStatus:
      name: "status"
      in: "query"
      schema:
        type: "string"
        enum: ["active", "inactive"]
    MovementType:
      name: "type"
      in: "query"
      schema:
        type: "string"
        enum: ["admission", "partial_new", "partial_existing", "total", "departure", "mortality", "mortality_correction", "redistribution_reversal"]
  responses:
    Unauthenticated:
      description: "Sesión o token ausente o inválido."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: "El usuario no tiene el permiso funcional requerido o está dado de baja."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: "No existe el recurso o una reference requerida."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: "Conflicto de versión, capacidad, cantidad, estado, período, stock o clave de idempotencia. No se aplican cambios parciales."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
    InvalidInput:
      description: "Entrada inválida, field desconocido o encabezado obligatorio ausente."
      content:
        "application/problem+json":
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Flock:
      type: "object"
      additionalProperties: false
      required: ["id", "code", "breed_id", "supplier_id", "supplier_name", "origin", "poultry_house_id", "production_unit_id", "initial_quantity", "current_quantity", "entry_date", "established_at", "age_days", "current_week", "status", "version", "notes", "finalized_at", "finalization_reason"]
      properties:
        id:
          type: "string"
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
          example: "01J00000000000000000000000"
        code:
          type: "string"
          minLength: 1
          maxLength: 60
