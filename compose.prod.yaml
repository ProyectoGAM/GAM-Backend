name: gam-prod

x-app: &app
  image: gam-backend:${RELEASE_SHA:?Set RELEASE_SHA to the release commit SHA}
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
    args:
      POSTGRES_CLIENT_VERSION: 18
  restart: unless-stopped
  environment: &app-env
    APP_NAME: GAM
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?Set APP_URL in .env.production}
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
    APP_LOCALE: es
    TZ: America/Montevideo
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${GAM_REDIS_PASSWORD:?Set GAM_REDIS_PASSWORD in .env.production}
    REDIS_DB: 0
    REDIS_CACHE_DB: 1
    CACHE_STORE: redis
    CACHE_PREFIX: gam_prod_cache_
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_CONNECTION: default
    SESSION_COOKIE: gam_session
    SESSION_DOMAIN: ${SESSION_DOMAIN:?Set SESSION_DOMAIN in .env.production}
    SESSION_SECURE_COOKIE: "true"
    SESSION_SAME_SITE: lax
    SESSION_LIFETIME: ${SESSION_LIFETIME:-129600}
    IDENTITY_PIN_PEPPER: ${IDENTITY_PIN_PEPPER:?Set IDENTITY_PIN_PEPPER in .env.production}
    IDENTITY_PIN_PEPPER_VERSION: ${IDENTITY_PIN_PEPPER_VERSION:-v1}
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?Set SANCTUM_STATEFUL_DOMAINS in .env.production}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-GAM}
    PULSE_ENABLED: "false"
    HORIZON_PREFIX: "gam_prod_horizon:"
  volumes:
    - storage-data:/var/www/html/storage
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      TZ: America/Montevideo
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${GAM_REDIS_PASSWORD:?Set GAM_REDIS_PASSWORD in .env.production}
    command:
      - sh
      - -ec
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend

  app-init:
    <<: *app
    restart: "no"
    command: ["php", "artisan", "migrate", "--force", "--isolated", "--no-interaction"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app
    command: ["php-fpm", "-F"]
    expose:
      - "9000"
    depends_on:
      app-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.32.14
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: '[{"url":"/docs/openapi/authentication.yaml","name":"Autenticación"}]'
    volumes:
      - ./contracts/openapi:/usr/share/nginx/html/openapi:ro
    networks:
      - backend

  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
      swagger-ui:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

configs:
  nginx-config:
    file: ./docker/nginx/default.conf

volumes:
  postgres-data:
  redis-data:
  storage-data:

networks:
  backend:
    name: gam_prod_backend
    driver: bridge
