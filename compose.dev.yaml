# Stack de desarrollo autónomo para GAM.
# No depende de compose.yaml.
#
# Inicio:
#   docker compose -f compose.dev.yaml up --build
#
# Las credenciales incluidas son sólo valores locales. Pueden reemplazarse
# mediante el .env del proyecto.

name: gam-dev

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: development
  args:
    POSTGRES_CLIENT_VERSION: 18

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-GAM}
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:${API_PORT:-8080}
  APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  TZ: ${TZ:-America/Montevideo}

  LOG_CHANNEL: stderr
  LOG_LEVEL: debug

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-gam}
  DB_USERNAME: ${DB_USERNAME:-gam}
  DB_PASSWORD: ${DB_PASSWORD:-gam_dev_password}

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${GAM_REDIS_PASSWORD:-gam_dev_redis_password}
  REDIS_DB: 0
  REDIS_CACHE_DB: 1

  CACHE_STORE: redis
  CACHE_PREFIX: gam_dev_cache_
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_COOKIE: gam_session
  SESSION_DOMAIN: localhost
  SESSION_SECURE_COOKIE: "false"
  SESSION_SAME_SITE: lax

  SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-4200},localhost:${API_PORT:-8080},127.0.0.1:${FRONTEND_PORT:-4200},127.0.0.1:${API_PORT:-8080}
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}

  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_USERNAME: null
  MAIL_PASSWORD: null
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${APP_NAME:-GAM}

  PULSE_ENABLED: "true"
  HORIZON_PREFIX: "gam_dev_horizon:"

x-app-volumes: &app-volumes # Hot reload del código PHP.
  - .:/var/www/html
  # Dependencias y directorios escribibles aislados del host.
  - vendor-data:/var/www/html/vendor
  - storage-data:/var/www/html/storage
  - bootstrap-cache-data:/var/www/html/bootstrap/cache

x-app-service: &app-service
  image: gam-api:dev
  build: *app-build
  environment: *app-environment
  restart: unless-stopped
  user: www-data
  volumes: *app-volumes
  networks:
    - gam-dev
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gam}
      POSTGRES_USER: ${DB_USERNAME:-gam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gam_dev_password}
      TZ: ${TZ:-America/Montevideo}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 usa /var/lib/postgresql como volumen principal.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - gam-dev

  redis:
    image: redis:8-alpine
    user: redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${GAM_REDIS_PASSWORD:-gam_dev_redis_password}
    environment:
      REDIS_PASSWORD: ${GAM_REDIS_PASSWORD:-gam_dev_redis_password}
      TZ: ${TZ:-America/Montevideo}
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - gam-dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Montevideo}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
    networks:
      - gam-dev
    security_opt:
      - no-new-privileges:true

  api:
    <<: *app-service
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        php artisan optimize:clear
        php artisan migrate --force --isolated --no-interaction
        exec /usr/local/sbin/php-fpm -F
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  horizon:
    <<: *app-service
    command:
      - php
      - artisan
      - horizon
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s

  scheduler:
    <<: *app-service
    command:
      - php
      - artisan
      - schedule:work
      - --no-interaction
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    
  pulse:
    <<: *app-service
    command:
      - php
      - artisan
      - pulse:check
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gam-dev
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

configs:
  nginx-config:
    file: ./docker/nginx/default.conf

volumes:
  postgres-data:
  redis-data:
  vendor-data:
  storage-data:
  bootstrap-cache-data:

networks:
  gam-dev:
    driver: bridge
